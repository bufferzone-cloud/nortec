<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>NORTEC · Admin Console</title>
<link rel="icon" href="logo.png" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
  :root{
    --blue:#2563eb; --blue-dark:#1e40af; --blue-light:#eff6ff; --blue-soft:#dbeafe; --blue-bright:#3b82f6;
    --green:#10b981; --red:#ef4444; --amber:#f59e0b; --purple:#8b5cf6; --pink:#ec4899; --teal:#14b8a6;
    --text:#0f172a; --text2:#1e293b; --muted:#64748b;
    --border:#e2e8f0; --soft:#f8fafc;
    --sidebar-w:262px;
    --shadow:0 8px 32px rgba(0,0,0,.08);
    --shadow-lg:0 20px 60px rgba(0,0,0,.15);
  }
  html,body{width:100%;height:100%;background:#f1f5f9;color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased}

  #appLoader{position:fixed;inset:0;background:#0f172a;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .4s}
  #appLoader.hidden{opacity:0;pointer-events:none}
  .loader-spinner{width:52px;height:52px;border:4px solid rgba(255,255,255,.15);border-top-color:var(--blue-bright);border-radius:50%;animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* LOGIN */
  #loginGate{position:fixed;inset:0;z-index:9000;background:linear-gradient(135deg,#0f172a,#1e293b);display:flex;align-items:center;justify-content:center;padding:20px}
  .login-card{background:#fff;border-radius:22px;padding:36px 30px;max-width:440px;width:100%;box-shadow:var(--shadow-lg);text-align:center}
  .login-card img{width:72px;height:72px;object-fit:contain;border-radius:16px;background:var(--blue-light);padding:8px;margin-bottom:14px}
  .login-card h1{font-size:22px;font-weight:900;color:var(--text);margin-bottom:4px}
  .login-card h1 span{color:var(--blue)}
  .login-card p{font-size:13px;color:var(--muted);margin-bottom:22px}
  .login-card input{width:100%;padding:13px 16px;border:1.5px solid var(--border);border-radius:12px;font-family:inherit;font-size:14.5px;background:var(--soft);margin-bottom:12px;outline:none;transition:.2s}
  .login-card input:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
  .login-card button{width:100%;padding:14px;border-radius:50px;border:none;font-weight:700;font-size:15px;color:#fff;background:linear-gradient(135deg,#2563eb,#1e40af);cursor:pointer;transition:.2s;font-family:inherit;box-shadow:0 8px 26px rgba(37,99,235,.35)}
  .login-card button:hover{transform:translateY(-2px)}
  .login-card button:disabled{opacity:.65;cursor:not-allowed;transform:none}
  .login-msg{margin-top:14px;font-size:13px;color:var(--red);min-height:18px}

  .app-root{display:flex;height:100dvh;width:100%;overflow:hidden;position:relative;background:#f1f5f9}

  /* SIDEBAR */
  .sidebar{width:var(--sidebar-w);height:100dvh;background:#0f172a;color:#cbd5e1;display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;transition:transform .3s;border-right:1px solid #1e293b;z-index:300}
  .sidebar-head{padding:18px 20px;border-bottom:1px solid #1e293b;display:flex;align-items:center;gap:12px;flex-shrink:0}
  .sidebar-head img{width:38px;height:38px;object-fit:contain;border-radius:9px;background:#1e293b;padding:4px}
  .sidebar-head .ttl{font-size:15px;font-weight:900;color:#fff;line-height:1.1}
  .sidebar-head .ttl span{color:#3b82f6}
  .sidebar-head .sub{font-size:9.5px;color:#64748b;text-transform:uppercase;letter-spacing:1.2px;margin-top:2px}
  .sidebar-search{padding:12px 14px;border-bottom:1px solid #1e293b;flex-shrink:0}
  .sidebar-search input{width:100%;padding:9px 12px;border-radius:9px;border:1px solid #334155;background:#1e293b;color:#e2e8f0;font-size:12.5px;outline:none;font-family:inherit}
  .sidebar-search input:focus{border-color:var(--blue)}
  .sidebar-search input::placeholder{color:#64748b}
  .sidebar-nav{flex:1;overflow-y:auto;padding:8px 0}
  .sidebar-nav::-webkit-scrollbar{width:5px}
  .sidebar-nav::-webkit-scrollbar-thumb{background:#334155;border-radius:20px}
  .nav-group{padding:8px 0 4px}
  .nav-group-lbl{padding:6px 20px;font-size:9.5px;font-weight:800;color:#475569;text-transform:uppercase;letter-spacing:1.2px}
  .nav-item{display:flex;align-items:center;gap:12px;padding:10px 20px;background:none;border:none;width:100%;text-align:left;font-size:13px;font-weight:600;color:#94a3b8;cursor:pointer;transition:.15s;font-family:inherit;border-left:3px solid transparent;position:relative}
  .nav-item:hover{background:#1e293b;color:#fff}
  .nav-item.active{background:#1e293b;color:#fff;border-left-color:var(--blue)}
  .nav-item i{width:20px;text-align:center;font-size:14px;color:#64748b;flex-shrink:0}
  .nav-item.active i,.nav-item:hover i{color:var(--blue-bright)}
  .nav-item .badge{margin-left:auto;background:var(--red);color:#fff;font-size:9.5px;font-weight:800;padding:2px 8px;border-radius:20px;min-width:20px;text-align:center}
  .sidebar-foot{padding:12px 16px;border-top:1px solid #1e293b;flex-shrink:0}
  .sb-user{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .sb-user .av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;flex-shrink:0}
  .sb-user .info{flex:1;min-width:0}
  .sb-user .info .nm{font-size:12.5px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sb-user .info .rl{font-size:10.5px;color:#64748b;text-transform:uppercase;letter-spacing:.5px}
  .sb-logout{width:100%;padding:10px;border-radius:9px;border:none;background:#1e293b;color:#ef4444;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit;transition:.2s;display:flex;align-items:center;justify-content:center;gap:8px}
  .sb-logout:hover{background:#7f1d1d;color:#fff}

  /* MAIN */
  .main-area{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
  .top-bar{background:#fff;border-bottom:1px solid var(--border);padding:12px 22px;display:flex;align-items:center;gap:14px;flex-shrink:0;min-height:64px;box-shadow:0 2px 8px rgba(0,0,0,.02)}
  .menu-toggle{display:none;background:none;border:none;font-size:22px;color:var(--text);cursor:pointer}
  .top-title{flex:1;min-width:0}
  .top-title h1{font-size:18px;font-weight:900;color:var(--text);line-height:1.2}
  .top-title h1 i{color:var(--blue);margin-right:8px}
  .top-title p{font-size:12px;color:var(--muted);margin-top:2px}
  .top-actions{display:flex;gap:8px;align-items:center}
  .btn-icon{background:var(--soft);border:1px solid var(--border);color:var(--blue);width:40px;height:40px;border-radius:10px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;position:relative;font-family:inherit}
  .btn-icon:hover{background:var(--blue-light);transform:scale(1.04)}
  .btn-icon .badge{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:9px;font-weight:800;border-radius:30px;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid #fff}

  .content{flex:1;overflow-y:auto;padding:22px;background:#f1f5f9}
  .content::-webkit-scrollbar{width:6px}
  .content::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:20px}

  .page{display:none;animation:fadeIn .3s ease}
  .page.active{display:block}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .card{background:#fff;border-radius:14px;padding:20px;border:1px solid var(--border);box-shadow:0 2px 8px rgba(0,0,0,.03);margin-bottom:16px}
  .card h3{font-size:15px;font-weight:800;color:var(--text);margin-bottom:14px;display:flex;align-items:center;gap:8px;padding-bottom:10px;border-bottom:2px solid var(--soft);flex-wrap:wrap}
  .card h3 i{color:var(--blue)}
  .card h3 .right{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}

  .stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:16px}
  .stat-card{background:#fff;border-radius:14px;padding:18px 16px;border:1px solid var(--border);position:relative;overflow:hidden;transition:.2s;cursor:pointer}
  .stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:rgba(37,99,235,.2)}
  .stat-card .ico{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:12px}
  .stat-card .lbl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .stat-card .val{font-size:26px;font-weight:900;color:var(--text);margin-top:2px;line-height:1}
  .stat-card .sub{font-size:11.5px;color:var(--muted);margin-top:6px}
  .stat-card.blue .ico{background:var(--blue-light);color:var(--blue)}
  .stat-card.green .ico{background:#d1fae5;color:var(--green)}
  .stat-card.amber .ico{background:#fef3c7;color:var(--amber)}
  .stat-card.red .ico{background:#fee2e2;color:var(--red)}
  .stat-card.purple .ico{background:#ede9fe;color:var(--purple)}
  .stat-card.pink .ico{background:#fce7f3;color:var(--pink)}
  .stat-card.teal .ico{background:#ccfbf1;color:var(--teal)}

  .btn{padding:10px 18px;border-radius:10px;border:none;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:7px;transition:.2s}
  .btn.primary{background:linear-gradient(135deg,#2563eb,#1e40af);color:#fff;box-shadow:0 4px 12px rgba(37,99,235,.25)}
  .btn.primary:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(37,99,235,.35)}
  .btn.green{background:linear-gradient(135deg,#10b981,#059669);color:#fff}
  .btn.red{background:linear-gradient(135deg,#ef4444,#b91c1c);color:#fff}
  .btn.amber{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff}
  .btn.ghost{background:#f1f5f9;color:var(--text);border:1.5px solid var(--border)}
  .btn.ghost:hover{background:#e2e8f0}
  .btn.sm{padding:7px 14px;font-size:12px}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}

  .form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:12px}
  .form-group{margin-bottom:12px}
  .form-group label{display:block;font-size:11.5px;font-weight:700;color:#334155;margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
  .form-group input,.form-group select,.form-group textarea{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:10px;font-family:inherit;font-size:13.5px;background:var(--soft);color:var(--text);transition:.2s;outline:none}
  .form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
  .form-group textarea{resize:vertical;min-height:70px;line-height:1.5}
  .form-group .hint{font-size:11px;color:var(--muted);margin-top:4px}

  .tbl-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--border);background:#fff}
  table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
  th{background:var(--soft);text-align:left;padding:11px 12px;font-weight:800;color:var(--text);text-transform:uppercase;font-size:10.5px;letter-spacing:.5px;white-space:nowrap;border-bottom:2px solid var(--border)}
  td{padding:10px 12px;border-bottom:1px solid var(--border);color:#334155;vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--blue-light)}
  tbody tr.clickable{cursor:pointer}

  .badge{display:inline-block;padding:3px 11px;border-radius:20px;font-size:10.5px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;white-space:nowrap}
  .badge.green{background:#d1fae5;color:#065f46}
  .badge.red{background:#fee2e2;color:#991b1b}
  .badge.amber{background:#fef3c7;color:#92400e}
  .badge.blue{background:var(--blue-soft);color:var(--blue-dark)}
  .badge.purple{background:#ede9fe;color:#5b21b6}
  .badge.grey{background:#f1f5f9;color:#475569}
  .badge.pink{background:#fce7f3;color:#9d174d}

  .empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:13px;background:#fff;border-radius:14px;border:1px dashed var(--border)}
  .empty i{font-size:36px;display:block;margin-bottom:12px;opacity:.35}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .toolbar input,.toolbar select{padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;font-family:inherit;font-size:13px;background:#fff;outline:none;transition:.2s;min-width:160px}
  .toolbar input:focus,.toolbar select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
  .toolbar .spacer{flex:1}
  .chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .chip{padding:7px 14px;border-radius:20px;background:#fff;border:1.5px solid var(--border);font-size:12px;font-weight:700;color:var(--text);cursor:pointer;transition:.2s;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
  .chip:hover{border-color:var(--blue);color:var(--blue-dark)}
  .chip.active{background:var(--blue);color:#fff;border-color:var(--blue)}
  .chip .cnt{background:rgba(255,255,255,.2);padding:1px 7px;border-radius:20px;font-size:10.5px}
  .chip:not(.active) .cnt{background:var(--blue-light);color:var(--blue-dark)}

  .modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(6px);z-index:9999;display:none;align-items:center;justify-content:center;padding:20px}
  .modal-overlay.open{display:flex}
  .modal-box{background:#fff;border-radius:18px;max-width:640px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);position:relative;animation:modalIn .3s ease}
  @keyframes modalIn{from{opacity:0;transform:scale(.95) translateY(10px)}to{opacity:1;transform:none}}
  .modal-hd{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;position:sticky;top:0;background:#fff;z-index:2;border-radius:18px 18px 0 0}
  .modal-hd h3{font-size:16px;font-weight:900;color:var(--text);flex:1}
  .modal-hd .ico{width:38px;height:38px;border-radius:10px;background:var(--blue-light);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:16px}
  .modal-close{background:var(--soft);border:none;width:34px;height:34px;border-radius:50%;font-size:16px;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;font-family:inherit}
  .modal-close:hover{background:var(--border);color:var(--text)}
  .modal-body{padding:20px 22px}
  .modal-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:#fff;border-radius:0 0 18px 18px;flex-wrap:wrap}

  #toast{position:fixed;top:20px;right:20px;z-index:99999;display:flex;flex-direction:column;gap:10px;max-width:340px}
  .toast{padding:13px 18px;border-radius:12px;font-size:13px;font-weight:600;color:#fff;box-shadow:0 12px 34px rgba(0,0,0,.25);display:flex;align-items:center;gap:10px;animation:toastIn .3s ease}
  @keyframes toastIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
  .toast.ok{background:linear-gradient(135deg,#10b981,#059669)}
  .toast.err{background:linear-gradient(135deg,#ef4444,#b91c1c)}
  .toast.info{background:linear-gradient(135deg,#3b82f6,#2563eb)}

  .chart-wrap{position:relative;height:280px;margin-top:8px}

  .feed-item{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);align-items:flex-start}
  .feed-item:last-child{border-bottom:none}
  .feed-item .dot{width:9px;height:9px;border-radius:50%;background:var(--blue);flex-shrink:0;margin-top:6px;box-shadow:0 0 0 4px rgba(37,99,235,.15)}
  .feed-item .dot.green{background:var(--green);box-shadow:0 0 0 4px rgba(16,185,129,.15)}
  .feed-item .dot.red{background:var(--red);box-shadow:0 0 0 4px rgba(239,68,68,.15)}
  .feed-item .dot.amber{background:var(--amber);box-shadow:0 0 0 4px rgba(245,158,11,.15)}
  .feed-item .fbody{flex:1;min-width:0}
  .feed-item .fttl{font-size:13px;font-weight:700;color:var(--text);line-height:1.3}
  .feed-item .fmeta{font-size:11.5px;color:var(--muted);margin-top:3px}

  /* ═══ TEVETA FORM ═══ */
  .teveta-form-container{font-family:'Inter',sans-serif;background:#fff;padding:26px 24px;border:1px solid var(--border);border-radius:16px;box-shadow:0 4px 16px rgba(0,0,0,.04)}
  .teveta-form-container .form-header{text-align:center;margin-bottom:22px;padding-bottom:14px;border-bottom:2px solid #0f172a}
  .teveta-form-container .form-header h2{font-size:19px;font-weight:900;color:var(--text);text-transform:uppercase;letter-spacing:.5px;margin-top:8px}
  .teveta-form-container .form-header .logo-section{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px}
  .teveta-form-container .form-header .logo-section img{height:60px;object-fit:contain}
  .teveta-form-container .form-header .logo-section .address-text{font-size:10px;color:#475569;text-align:right;line-height:1.45;flex:1;min-width:200px}
  .teveta-form-container .form-header .logo-section .address-text strong{color:var(--text)}
  .teveta-form-container .form-field{margin-bottom:11px;display:flex;align-items:flex-start;gap:6px;flex-wrap:wrap}
  .teveta-form-container .form-field .field-number{font-weight:800;color:var(--text);min-width:26px;font-size:13.5px;flex-shrink:0}
  .teveta-form-container .form-field .field-label{font-weight:700;color:var(--text);font-size:13px;min-width:160px;flex-shrink:0}
  .teveta-form-container .form-field .field-input{flex:1;min-width:180px;border:none;border-bottom:1.5px solid var(--text);padding:2px 6px;font-size:13.5px;font-family:'Inter',sans-serif;background:transparent;outline:none;color:var(--text);transition:.2s}
  .teveta-form-container .form-field .field-input:focus{border-bottom:2px solid var(--blue);background:#f8fafc}
  .teveta-form-container .form-field .field-input[readonly]{border-bottom:1.5px solid #94a3b8;color:#475569}
  .teveta-form-container .box-group{display:flex;gap:5px;align-items:center;flex-wrap:wrap;flex:1}
  .teveta-form-container .box-input{border:1.5px solid var(--text);padding:5px 4px;font-size:13px;font-family:'Inter',sans-serif;background:#fff;outline:none;width:34px;text-align:center;color:var(--text);font-weight:700;border-radius:4px;transition:.2s}
  .teveta-form-container .box-input:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(37,99,235,.15)}
  .teveta-form-container .box-input:disabled,.teveta-form-container .box-input.readonly{background:#f1f5f9;color:#64748b;border-color:#94a3b8}
  .teveta-form-container .box-sep{font-size:14px;color:#64748b;font-weight:700;margin:0 2px}
  .teveta-form-container .radio-group{display:flex;align-items:center;gap:16px;flex-wrap:wrap;flex:1}
  .teveta-form-container .radio-opt{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--text);font-weight:500;cursor:pointer}
  .teveta-form-container .radio-opt input[type="radio"]{accent-color:var(--blue);width:15px;height:15px;cursor:pointer}
  .teveta-form-container .radio-opt input[type="radio"]:disabled{cursor:not-allowed}
  .teveta-form-container .radio-opt input[type="radio"]:disabled+span{color:#94a3b8}
  .teveta-form-container .subjects-list{flex:1;min-width:260px;display:flex;flex-direction:column;gap:6px;margin-top:2px}
  .teveta-form-container .subject-row{display:flex;align-items:center;gap:10px;font-size:13px;padding:3px 0}
  .teveta-form-container .subject-row input[type="checkbox"]{width:16px;height:16px;accent-color:var(--blue);cursor:pointer;flex-shrink:0}
  .teveta-form-container .subject-row input[type="checkbox"]:disabled{cursor:not-allowed;accent-color:#94a3b8}

/* ═══════════════════════════════════════════════════════════════
   HELPERS
   ═══════════════════════════════════════════════════════════════ */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(ts){ if(!ts) return '—'; const d = new Date(ts); if(isNaN(d)) return '—'; return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtDateTime(ts){ if(!ts) return '—'; const d = new Date(ts); if(isNaN(d)) return '—'; return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})+' · '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }
function toArray(obj){ return obj ? Object.entries(obj).map(([id,v]) => (v && typeof v === 'object') ? {id, ...v} : {id, value:v}) : []; }
function capitalize(s){ s = String(s||''); return s.charAt(0).toUpperCase()+s.slice(1); }
function getInitials(name){ if(!name) return '?'; const p = String(name).trim().split(/\s+/); return ((p[0]?.[0]||'')+(p[1]?.[0]||'')).toUpperCase() || '?'; }
function emptyState(msg, icon='fa-inbox'){ return `<div class="empty"><i class="fas ${icon}"></i>${esc(msg)}</div>`; }
function emailKey(email){ return String(email||'').toLowerCase().replace(/[.@]/g,'_'); }

function toast(msg, type='info'){
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const ico = type==='ok' ? 'fa-circle-check' : type==='err' ? 'fa-circle-exclamation' : 'fa-circle-info';
  el.innerHTML = `<i class="fas ${ico}"></i><span>${esc(msg)}</span>`;
  $('#toast').appendChild(el);
  setTimeout(() => { el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(() => el.remove(), 300); }, 3800);
}

function statusBadge(status){
  const s = String(status||'pending').toLowerCase();
  const cls = ['approved','resolved','issued','completed','ready','allocated','active','cleared','pass','paid','collected','graduated'].includes(s) ? 'green'
    : ['rejected','cancelled','failed','banned','suspended','overdue'].includes(s) ? 'red'
    : ['pending','awaiting','submitted','in-review','in_review','processing','under-review'].includes(s) ? 'amber'
    : 'blue';
  return `<span class="badge ${cls}">${esc(s.replace(/_/g,' '))}</span>`;
}

function can(module){
  if(!currentRole || !currentRole.modules) return false;
  if(currentRole.modules.includes('*')) return true;
  return currentRole.modules.includes(module);
}

/* Departments this staff member may act on */
function myDepartments(){
  if(currentStaff.role === 'Super Admin') return DEPARTMENTS.map(d => d.id);
  const out = [];
  const push = v => { if(v && DEPT_BY_ID[v] && !out.includes(v)) out.push(v); };
  if(Array.isArray(currentStaff.departments)) currentStaff.departments.forEach(push);
  push(currentStaff.department);
  const roleDepts = (ROLES[currentStaff.role] || {}).departments || [];
  roleDepts.forEach(push);
  return out;
}

/* Is a student cleared for a department? Handles both new (id) and legacy (name) keys */
function isClearedFor(app, deptId){
  const dept = DEPT_BY_ID[deptId];
  const c = (app && app.clearance) || {};
  const v1 = c[deptId];
  if(v1 === 'cleared' || (v1 && v1.status === 'cleared')) return true;
  if(dept){
    const v2 = c[dept.name];
    if(v2 === 'cleared' || (v2 && v2.status === 'cleared')) return true;
  }
  return false;
}

/* ═══════════════════════════════════════════════════════════════
   LOGIN / AUTH
   ═══════════════════════════════════════════════════════════════ */
function showLoginGate(msg=''){
  $('#loginGate').style.display = 'flex';
  $('#appRoot').style.display = 'none';
  $('#appLoader').classList.add('hidden');
  $('#loginMsg').textContent = msg || '';
  $('#loginBtn').disabled = false;
  $('#loginBtn').innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
}

auth.onAuthStateChanged(async user => {
  if(!user){ showLoginGate(); return; }

  try{
    const uid = user.uid;

    /* 1 — direct UID record */
    let snap = await db.ref(`${ROOT}/staff/${uid}`).get();

    /* 2 — fall back to the e-mail index (invited-but-never-signed-in staff) */
    if(!snap.exists()){
      const idx = await db.ref(`${ROOT}/staffEmailIndex/${emailKey(user.email)}`).get();
      if(idx.exists()){
        const rec = idx.val();
        await db.ref(`${ROOT}/staff/${uid}`).set({ ...rec, email:user.email, uid, linkedAt:Date.now() });
        snap = await db.ref(`${ROOT}/staff/${uid}`).get();
      }
    }

    /* 3 — first-run bootstrap: if NO staff exist at all, first login becomes Super Admin */
    if(!snap.exists()){
      const all = await db.ref(`${ROOT}/staff`).get();
      if(!all.exists() || Object.keys(all.val()||{}).length === 0){
        await db.ref(`${ROOT}/staff/${uid}`).set({
          name: user.email.split('@')[0],
          email: user.email,
          role: 'Super Admin',
          departments: DEPARTMENTS.map(d => d.id),
          uid, active:true, bootstrapped:true, createdAt: Date.now()
        });
        snap = await db.ref(`${ROOT}/staff/${uid}`).get();
      }
    }

    if(!snap.exists()){
      await auth.signOut();
      showLoginGate('This account is not registered as staff. Ask an administrator to add you.');
      return;
    }

    const rec = snap.val();
    if(rec.active === false){
      await auth.signOut();
      showLoginGate('Your staff account has been disabled.');
      return;
    }

    currentUser  = user;
    currentStaff = { ...rec, uid };
    currentRole  = ROLES[currentStaff.role] || ROLES['Support Staff'];

    await db.ref(`${ROOT}/staff/${uid}/lastLogin`).set(Date.now());
    initApp();
  }catch(e){
    console.error(e);
    showLoginGate('Login failed: ' + e.message);
  }
});

$('#loginBtn').addEventListener('click', async () => {
  const email = $('#loginEmail').value.trim().toLowerCase();
  const password = $('#loginPassword').value;
  if(!email || !password){ $('#loginMsg').textContent = 'Enter email and password.'; return; }
  $('#loginBtn').disabled = true;
  $('#loginBtn').innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in…';
  $('#loginMsg').textContent = '';
  try{
    await auth.signInWithEmailAndPassword(email, password);
  }catch(e){
    $('#loginMsg').textContent = String(e.message||'').replace('Firebase: ','');
    $('#loginBtn').disabled = false;
    $('#loginBtn').innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
  }
});
['loginEmail','loginPassword'].forEach(id => {
  document.getElementById(id)?.addEventListener('keydown', e => { if(e.key === 'Enter') $('#loginBtn').click(); });
});

$('#logoutBtn').addEventListener('click', async () => {
  if(!confirm('Log out?')) return;
  await logAudit('logout', 'Staff logged out');
  await auth.signOut();
  location.reload();
});

/* ═══════════════════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════════════════ */
function initApp(){
  $('#appLoader').classList.add('hidden');
  $('#appRoot').style.display = 'flex';
  $('#loginGate').style.display = 'none';

  $('#sbName').textContent   = currentStaff.name || currentUser.email;
  $('#sbRole').textContent   = currentStaff.role || 'Staff';
  $('#sbAvatar').textContent = getInitials(currentStaff.name || currentUser.email);
  const depts = myDepartments().map(id => DEPT_BY_ID[id]?.name).filter(Boolean);
  $('#sbDept').textContent = depts.length ? depts.join(' · ') : (currentStaff.role || 'Admin Panel');

  const first = NAV_GROUPS.flatMap(g => g.items).find(it => can(it.id));
  if(first) activePage = first.id;

  buildSidebar();
  bindUI();
  bindRealtime();
  gotoPage(activePage);
  logAudit('login', 'Staff signed in');
}

function buildSidebar(){
  const nav = $('#sidebarNav');
  nav.innerHTML = NAV_GROUPS.map(g => {
    const visible = g.items.filter(it => can(it.id));
    if(!visible.length) return '';
    return `
      <div class="nav-group" data-group="${esc(g.group)}">
        <div class="nav-group-lbl">${esc(g.group)}</div>
        ${visible.map(it => `
          <button class="nav-item ${it.id===activePage?'active':''}" data-page="${it.id}">
            <i class="fas ${it.icon}"></i> <span>${esc(it.label)}</span>
            ${it.badge ? `<span class="badge" data-badge="${it.badge}" style="display:none">0</span>` : ''}
          </button>
        `).join('')}
      </div>`;
  }).join('');
  nav.querySelectorAll('.nav-item').forEach(btn => btn.addEventListener('click', () => gotoPage(btn.dataset.page)));
}

function filterSidebar(q){
  q = (q||'').toLowerCase();
  $$('#sidebarNav .nav-item').forEach(btn => {
    btn.style.display = (!q || btn.textContent.toLowerCase().includes(q)) ? '' : 'none';
  });
  $$('#sidebarNav .nav-group').forEach(g => {
    const visible = [...g.querySelectorAll('.nav-item')].some(b => b.style.display !== 'none');
    g.style.display = visible ? '' : 'none';
  });
}

function bindUI(){
  $('#navSearch').addEventListener('input', function(){ filterSidebar(this.value); });
  $('#menuToggle').addEventListener('click', () => {
    $('#sidebar').classList.toggle('open');
    $('#sidebarOverlay').classList.toggle('active');
  });
  $('#sidebarOverlay').addEventListener('click', () => {
    $('#sidebar').classList.remove('open');
    $('#sidebarOverlay').classList.remove('active');
  });
  $('#refreshBtn').addEventListener('click', () => { toast('Refreshed','info'); renderActive(); });
  $('#notifBtn').addEventListener('click', () => gotoPage('notifications'));
  $('#modalClose').addEventListener('click', closeModal);
  $('#modalOverlay').addEventListener('click', e => { if(e.target === $('#modalOverlay')) closeModal(); });
  document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });
}

function gotoPage(id){
  if(!can(id)){ toast('Access denied to ' + id, 'err'); return; }
  activePage = id;
  $$('#sidebarNav .nav-item').forEach(b => b.classList.toggle('active', b.dataset.page === id));
  $('#sidebar').classList.remove('open');
  $('#sidebarOverlay').classList.remove('active');
  const meta = PAGE_META[id] || { title:'Page', sub:'', icon:'fa-file' };
  $('#pageTitle').innerHTML = `<i class="fas ${meta.icon}"></i> ${esc(meta.title)}`;
  $('#pageSub').textContent = meta.sub || '';
  $('#mainContent').scrollTop = 0;
  renderActive();
}

function renderActive(){
  const fn = PAGE_RENDERERS[activePage];
  if(fn){
    try{ fn(); }
    catch(e){
      console.warn('render error', activePage, e);
      $('#mainContent').innerHTML = emptyState('Failed to render: ' + e.message, 'fa-exclamation-triangle');
    }
  } else {
    $('#mainContent').innerHTML = emptyState('Coming soon: ' + activePage, 'fa-tools');
  }
}

function bindRealtime(){
  const listen = (path, key) => db.ref(`${ROOT}/${path}`).on('value', s => {
    state[key] = toArray(s.val());
    updateBadges();
    if(PAGE_RENDERERS[activePage]) renderActive();
  });

  listen('applications',        'applications');
  listen('users',               'users');
  listen('courses',             'courses');
  listen('subfolders',          'subfolders');
  listen('videos',              'videos');
  listen('docs',                'docs');
  listen('pendingPurchases',    'transactions');
  listen('allComplaints',       'complaints');
  listen('complaints',          'userComplaints');
  listen('appeals',             'appeals');
  listen('accommodationRequests','accommodationReq');
  listen('accommodations',      'accommodations');
  listen('teveta',              'teveta');
  listen('supRequests',         'supRequests');
  listen('exams',               'exams');
  listen('timetables',          'timetables');
  listen('assessments',         'assessments');
  listen('library/books',       'libraryBooks');
  listen('jobs',                'jobs');
  listen('jobApplications',     'jobApplications');
  listen('alumni',              'alumni');
  listen('notices',             'notices');
  listen('inAppNotifications',  'inAppNotifications');
  listen('staff',               'staff');
  listen('auditLogs',           'audit');
  listen('schools',             'schools');
  listen('programmes',          'programmes');
  listen('finance',             'finance');

  /* settings is a plain object — do NOT convert to array */
  db.ref(`${ROOT}/settings`).on('value', s => {
    state.settings = s.val() || {};
    if(activePage === 'settings') renderActive();
  });
}

function updateBadges(){
  const badges = {
    applications: (state.applications||[]).filter(a => (a.status||'pending').toLowerCase()==='pending').length,
    complaints:   (state.complaints||[]).filter(c => ['pending','in-review','in_review'].includes((c.status||'pending').toLowerCase())).length,
    appeals:      (state.appeals||[]).filter(a => (a.status||'pending').toLowerCase()==='pending').length,
    teveta:       (state.teveta||[]).filter(t => (t.status||'submitted').toLowerCase()==='submitted').length
  };
  Object.entries(badges).forEach(([k,v]) => {
    $$(`#sidebarNav .badge[data-badge="${k}"]`).forEach(el => {
      el.textContent = v;
      el.style.display = v > 0 ? 'inline-block' : 'none';
    });
  });
  const total = badges.complaints + badges.appeals;
  const nb = $('#notifBadge');
  if(nb){ nb.textContent = total; nb.style.display = total > 0 ? 'flex' : 'none'; }
}

  const P  = state.transactions || [];

  const welcome = `
    <div class="card" style="background:linear-gradient(135deg,#1e40af,#2563eb);color:#fff;border:none">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:6px">
        <div>
          <div style="font-size:13px;opacity:.85">Welcome back,</div>
          <div style="font-size:22px;font-weight:900">${esc(currentStaff.name || currentUser.email)}</div>
          <div style="font-size:12.5px;opacity:.9;margin-top:4px">
            <i class="fas ${currentRole.icon||'fa-user'}"></i> ${esc(currentStaff.role||'Staff')}
            ${depts.length ? ' · ' + esc(depts.map(d => DEPT_BY_ID[d]?.name).filter(Boolean).join(', ')) : ''}
          </div>
        </div>
        <div style="text-align:right">
          <div style="font-size:11px;opacity:.75;text-transform:uppercase;letter-spacing:1px">Today</div>
          <div style="font-size:16px;font-weight:800">${new Date().toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric'})}</div>
        </div>
      </div>
    </div>`;

  /* Role-specific stat cards */
  let cards = '';
  if(can('students')){
    const students = A.filter(a => (a.status||'').toLowerCase()==='approved').length;
    cards += card('blue','fa-user-graduate','Students', students, 'Approved & active', 'students');
  }
  if(can('applications')){
    const pending = A.filter(a => (a.status||'pending').toLowerCase()==='pending').length;
    cards += card('amber','fa-file-alt','Pending Applications', pending, A.length + ' total', 'applications');
  }
  if(can('complaints')){
    const open = C.filter(c => ['pending','in-review','in_review'].includes((c.status||'pending').toLowerCase())).length;
    cards += card('purple','fa-comment-dots','Open Complaints', open, C.length + ' total', 'complaints');
  }
  if(can('appeals')){
    const open = AP.filter(a => (a.status||'pending').toLowerCase()==='pending').length;
    cards += card('red','fa-gavel','Open Appeals', open, AP.length + ' total', 'appeals');
  }
  if(can('teveta')){
    const pending = T.filter(t => (t.status||'submitted').toLowerCase()==='submitted').length;
    cards += card('pink','fa-check-double','TEVETA Entries', pending, 'Awaiting review', 'teveta');
  }
  if(can('payments')){
    const pending = P.filter(t => (t.status||'pending').toLowerCase()==='pending').length;
    cards += card('green','fa-receipt','Pending Payments', pending, 'To verify', 'payments');
  }
  if(can('clearance') && depts.length){
    const approved = A.filter(a => (a.status||'').toLowerCase()==='approved');
    let pendingClearance = 0;
    approved.forEach(a => depts.forEach(d => { if(!isClearedFor(a, d)) pendingClearance++; }));
    cards += card('teal','fa-check-circle','Clearance Pending', pendingClearance, 'In your department(s)', 'clearance');
  }
  if(can('library')){
    cards += card('amber','fa-book-open','Library Books', (state.libraryBooks||[]).length, 'In catalogue', 'library');
  }
  if(can('accommodation')){
    const req = (state.accommodationReq||[]).filter(r => (r.status||'pending').toLowerCase()==='pending').length;
    cards += card('amber','fa-bed','Room Requests', req, 'Awaiting allocation', 'accommodation');
  }

  /* Department clearance panel — every department gets a CLEAR button */
  let deptPanel = '';
  if(can('clearance') && depts.length){
    deptPanel = renderDepartmentPanel(depts);
  }

  /* Pending work quick list for this role */
  const quick = renderQuickWork();

  /* Recent activity */
  const feed = (state.audit||[]).slice().sort((a,b) => (b.timestamp||0)-(a.timestamp||0)).slice(0,8);
  const activity = `
    <div class="card">
      <h3><i class="fas fa-heart-pulse"></i> Recent Activity <span class="right">${feed.length}</span></h3>
      ${feed.length ? feed.map(a => `
        <div class="feed-item">
          <div class="dot"></div>
          <div class="fbody">
            <div class="fttl">${esc(a.action||'activity')}</div>
            <div class="fmeta">${esc(a.detail||'')}</div>
            <div class="fmeta"><i class="fas fa-user"></i> ${esc(a.adminName||a.adminEmail||'system')} · ${fmtDateTime(a.timestamp)}</div>

        </div>`).join('') : emptyState('No activity yet','fa-history')}

    <div class="card">

      <div class="chart-wrap"><canvas id="chartStatus"></canvas></div>

  $('#mainContent').innerHTML = welcome
    + `<div class="stats-grid">${cards || card('blue','fa-info-circle','No modules', '—', 'Contact admin','dashboard')}</div>`
    + deptPanel
    + quick

         ${chartCard}
         ${activity}
       </div>`;

  setTimeout(() => { try { renderDashboardCharts(); }catch(e){} }, 80);

function card(color, icon, label, val, sub, target){
  return `
    <div class="stat-card ${color}" onclick="gotoPage('${target}')">

      <div class="lbl">${esc(label)}</div>
      <div class="val">${val}</div>
      <div class="sub">${esc(sub)}</div>

}

/* Department clearance panel with a CLEAR button per student per department */
function renderDepartmentPanel(deptIds){
  const approved = (state.applications||[]).filter(a => (a.status||'').toLowerCase()==='approved');
  const depts = deptIds.map(id => DEPT_BY_ID[id]).filter(Boolean);
  if(!depts.length) return '';

  let html = `<div class="card">
    <h3><i class="fas fa-check-circle"></i> Departmental Clearance
      <span class="right">${approved.length} active students</span>
    </h3>`;

  depts.forEach(d => {
    const pending = approved.filter(a => !isClearedFor(a, d.id));
    html += `
      <div style="padding:14px 0;border-bottom:1px solid var(--border)">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px">
          <div style="font-weight:800;color:var(--text)">
            <i class="fas ${d.icon}" style="color:var(--blue);margin-right:8px"></i>${esc(d.name)} Department
          </div>
          <span class="badge ${pending.length ? 'amber' : 'green'}">${pending.length} pending</span>
        </div>
        ${pending.length ? `
          <div style="max-height:280px;overflow-y:auto">
            ${pending.map(a => `
              <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;background:var(--soft);border-radius:9px;margin-bottom:6px;flex-wrap:wrap">
                <div style="min-width:0">
                  <div style="font-weight:700;font-size:13px">${esc(a.fullName||'—')}</div>
                  <div style="font-size:11.5px;color:var(--muted)">${esc(a.studentNumber||'')} · ${esc(a.programme?.title||'')}</div>
                </div>
                <button class="btn green sm" onclick="clearStudentDept('${a.id}','${d.id}')">
                  <i class="fas fa-check"></i> Clear
                </button>
              </div>`).join('')}
          </div>`
        : `<div style="font-size:12.5px;color:var(--green);padding:6px 0;font-weight:600">
             <i class="fas fa-check-circle"></i> All students cleared in this department
           </div>`}
      </div>`;
  });

  html += `</div>`;
  return html;
}

/* Pending work relevant to this role */

  const items = [];

  if(can('applications')){
    (state.applications||[]).filter(a => (a.status||'pending').toLowerCase()==='pending').slice(0,5)
      .forEach(a => items.push({ icon:'fa-file-alt', color:'amber', title:'Application — '+esc(a.fullName||''), sub:esc(a.programme?.title||''), page:'applications' }));
  }
  if(can('complaints')){
    (state.complaints||[]).filter(c => ['pending','in-review','in_review'].includes((c.status||'pending').toLowerCase())).slice(0,5)
      .forEach(c => items.push({ icon:'fa-comment-dots', color:'purple', title:'Complaint — '+esc(c.subject||''), sub:esc(c.studentName||''), page:'complaints' }));
  }
  if(can('appeals')){
    (state.appeals||[]).filter(a => (a.status||'pending').toLowerCase()==='pending').slice(0,5)
      .forEach(a => items.push({ icon:'fa-gavel', color:'red', title:'Appeal — '+esc(a.category||''), sub:esc(a.studentName||''), page:'appeals' }));
  }
  if(can('teveta')){
    (state.teveta||[]).filter(t => (t.status||'submitted').toLowerCase()==='submitted').slice(0,5)
      .forEach(t => items.push({ icon:'fa-check-double', color:'pink', title:'TEVETA — '+esc(t.surname||'')+' '+esc(t.forenames||''), sub:esc(t.tevetaExamNo||''), page:'teveta' }));
  }
  if(can('payments')){
    (state.transactions||[]).filter(t => (t.status||'pending').toLowerCase()==='pending').slice(0,5)
      .forEach(t => items.push({ icon:'fa-receipt', color:'green', title:'Payment — ZMW '+(t.amount||0), sub:esc(t.userName||t.userEmail||''), page:'payments' }));
  }
  if(can('accommodation')){
    (state.accommodationReq||[]).filter(r => (r.status||'pending').toLowerCase()==='pending').slice(0,5)
      .forEach(r => items.push({ icon:'fa-bed', color:'amber', title:'Room request — '+esc(r.studentName||''), sub:esc(r.preferredBlock||''), page:'accommodation' }));

  return `
    <div class="card">
      <h3><i class="fas fa-list-check"></i> Your Pending Work <span class="right">${items.length}</span></h3>
      ${items.map(i => `
        <div class="feed-item" style="cursor:pointer" onclick="gotoPage('${i.page}')">

function renderDashboardCharts(){
  const c = document.getElementById('chartStatus');
  if(!c) return;
  if(dashboardChart){ try{ dashboardChart.destroy(); }catch(e){} dashboardChart = null; }
  const A  = state.applications || [];
  const p  = A.filter(a => (a.status||'pending').toLowerCase()==='pending').length;
  const ap = A.filter(a => (a.status||'').toLowerCase()==='approved').length;
  const r  = A.filter(a => (a.status||'').toLowerCase()==='rejected').length;
  dashboardChart = new Chart(c, {
    type:'doughnut',
    data:{ labels:['Pending','Approved','Rejected'], datasets:[{ data:[p,ap,r], backgroundColor:['#f59e0b','#10b981','#ef4444'], borderWidth:0 }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'bottom' } } }
  });
}

window.viewStudent = function(uid){
  const s = (state.applications||[]).find(x => x.id === uid);

window.approveApp = async function(uid){
  const s = (state.applications||[]).find(x => x.id === uid);
  if(!s) return;
  if(!confirm(`Approve ${s.fullName}?`)) return;
  try{
    let studentNumber = s.studentNumber;
    if(!studentNumber){
      const yy = String(new Date().getFullYear()).slice(-2);
      const res = await db.ref(`${ROOT}/counters/studentNumbers/${yy}`).transaction(c => (c||0) + 1);
      studentNumber = `${yy}01-${String(res.snapshot.val()).padStart(4,'0')}`;
    }
    await db.ref(`${ROOT}/applications/${uid}`).update({
      status:'approved', studentNumber, approvedAt:Date.now(), approvedBy:currentUser.email
    });
    await db.ref(`${ROOT}/userNotifications/${uid}`).push({
      icon:'fa-check-circle', text:'Your application was approved! Student No: '+studentNumber,
      timestamp:Date.now(), read:false
    });
    toast('Approved · ' + studentNumber,'ok');
    logAudit('approve-application','Approved '+s.fullName, uid);
  }catch(e){ toast('Failed: '+e.message,'err'); }
};

window.rejectApp = function(uid){
  const s = (state.applications||[]).find(x => x.id === uid);
  if(!s) return;
  openModal({
    title:'Reject Application', icon:'fa-times-circle',
    body:`<p style="color:var(--muted);margin-bottom:14px">Provide a reason for rejecting <b>${esc(s.fullName)}</b>.</p>
      <div class="form-group"><label>Reason</label><textarea id="rejReason" rows="3"></textarea></div>`,
    foot:`<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn red" onclick="confirmReject('${uid}')">Reject</button>`
  });
};

window.confirmReject = async function(uid){
  const reason = ($('#rejReason')?.value || '').trim() || 'Requirements not met';
  try{
    await db.ref(`${ROOT}/applications/${uid}`).update({
      status:'rejected', rejectionReason:reason, rejectedAt:Date.now(), rejectedBy:currentUser.email
    });
    await db.ref(`${ROOT}/userNotifications/${uid}`).push({
      icon:'fa-times-circle', text:'Your application was not successful. Reason: '+reason,
      timestamp:Date.now(), read:false
    });
    toast('Rejected','ok'); closeModal();
  }catch(e){ toast('Failed','err'); }
};

window.approvePayment = async function(txId){
  try{
    const snap = await db.ref(`${ROOT}/pendingPurchases`).get();
    const data = snap.val() || {};
    for(const uid in data){
      if(data[uid][txId]){
        const r = data[uid][txId];
        await db.ref(`${ROOT}/pendingPurchases/${uid}/${txId}`).update({ status:'approved', approvedAt:Date.now(), approvedBy:currentUser.email });
        if(r.itemType === 'course'){
          await db.ref(`${ROOT}/approvedPurchases/${uid}/${r.itemId}`).set({
            itemId:r.itemId, itemTitle:r.itemTitle, itemType:'course', amount:r.amount||0,
            durationType:'lifetime', durationValue:0, expiresAt:0,
            approvedAt:Date.now(), approvedBy:currentUser.email
          });
        }
        await db.ref(`${ROOT}/userNotifications/${uid}`).push({ icon:'fa-check-circle', text:'Payment approved for '+r.itemTitle, timestamp:Date.now(), read:false });
        toast('Approved','ok');
        logAudit('approve-payment','Approved '+r.itemTitle, uid);
        break;
      }
    }
  }catch(e){ toast('Failed','err'); }
};

window.rejectPayment = async function(txId){
  try{
    const snap = await db.ref(`${ROOT}/pendingPurchases`).get();
    const data = snap.val() || {};
    for(const uid in data){
      if(data[uid][txId]){
        await db.ref(`${ROOT}/pendingPurchases/${uid}/${txId}`).update({ status:'rejected', rejectedAt:Date.now(), rejectedBy:currentUser.email });
        await db.ref(`${ROOT}/userNotifications/${uid}`).push({ icon:'fa-times-circle', text:'Payment was rejected.', timestamp:Date.now(), read:false });
        break;
      }
    }
    toast('Rejected','ok');
  }catch(e){ toast('Failed','err'); }
};

/* ───── CLEARANCE ───── */
PAGE_RENDERERS.clearance = function(){
  const depts = myDepartments();

  if(!depts.length){
    $('#mainContent').innerHTML = emptyState('Your role has no assigned departments for clearance. Ask an administrator to assign one.', 'fa-info-circle');
    return;
  }

  const students = (state.applications||[]).filter(a => (a.status||'').toLowerCase()==='approved');
  if(!activeClearanceTab || !depts.includes(activeClearanceTab)) activeClearanceTab = depts[0];

  let html = `<div class="card">
    <h3><i class="fas fa-check-circle"></i> Departmental Clearance
      <span class="right">${students.length} active students</span>
    </h3>
    <p style="color:var(--muted);font-size:13px;margin-bottom:14px">
      You may clear students only in the departments assigned to your role.
    </p>
    <div class="chip-row">`;

  depts.forEach(did => {
    const d = DEPT_BY_ID[did];
    if(!d) return;
    const pending = students.filter(s => !isClearedFor(s, did));
    html += `<button class="chip ${activeClearanceTab===did?'active':''}" onclick="activeClearanceTab='${did}';renderActive();">
      <i class="fas ${d.icon}"></i> ${esc(d.name)} <span class="cnt">${pending.length}</span>
    </button>`;
  });
  html += `</div>`;

  const activeDept = DEPT_BY_ID[activeClearanceTab];
  if(activeDept){
    html += `
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>Student No.</th><th>Name</th><th>Programme</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody>
            ${students.length ? students.map(s => {
              const cleared = isClearedFor(s, activeDept.id);
              return `
                <tr>
                  <td><strong>${esc(s.studentNumber||'')}</strong></td>
                  <td>${esc(s.fullName||'')}</td>
                  <td>${esc(s.programme?.title||'')}</td>
                  <td>${cleared ? '<span class="badge green">Cleared</span>' : '<span class="badge amber">Pending</span>'}</td>
                  <td>
                    ${!cleared
                      ? `<button class="btn green sm" onclick="clearStudentDept('${s.id}','${activeDept.id}')"><i class="fas fa-check"></i> Clear</button>`
                      : `<button class="btn ghost sm" onclick="unclearStudentDept('${s.id}','${activeDept.id}')"><i class="fas fa-undo"></i> Undo</button>`}
                  </td>
                </tr>`;
            }).join('') : `<tr><td colspan="5">${emptyState('No active students','fa-user-graduate')}</td></tr>`}
          </tbody>
        </table>
      </div>`;
  }
  html += `</div>`;
  $('#mainContent').innerHTML = html;
};

/* Clear a student for a department */
window.clearStudentDept = async function(uid, deptId){
  const dept = DEPT_BY_ID[deptId];
  if(!dept) return toast('Department not found','err');

  const allowed = myDepartments();
  if(currentStaff.role !== 'Super Admin' && !allowed.includes(dept.id)){
    return toast('You are not authorized to clear for ' + dept.name,'err');
  }

  if(!confirm(`Clear this student for ${dept.name}?`)) return;

  try{
    await db.ref(`${ROOT}/applications/${uid}/clearance/${dept.id}`).set('cleared');
    await db.ref(`${ROOT}/applications/${uid}/clearanceMeta/${dept.id}`).set({
      deptId: dept.id, deptName: dept.name,
      clearedBy: currentUser.email, clearedByName: currentStaff.name || '',
      clearedAt: Date.now()
    });
    await db.ref(`${ROOT}/userNotifications/${uid}`).push({
      icon:'fa-check-circle', text:`${dept.name} Department has cleared you.`,
      timestamp:Date.now(), read:false
    });
    toast(`${dept.name} cleared`,'ok');
    logAudit('clearance', `Cleared ${dept.name}`, uid);
  }catch(e){ toast('Failed: '+e.message,'err'); }
};

window.unclearStudentDept = async function(uid, deptId){
  const dept = DEPT_BY_ID[deptId];
  if(!dept) return;

  const allowed = myDepartments();
  if(currentStaff.role !== 'Super Admin' && !allowed.includes(dept.id)){
    return toast('You are not authorized for ' + dept.name,'err');
  }
  if(!confirm(`Revoke ${dept.name} clearance?`)) return;

  try{
    await db.ref(`${ROOT}/applications/${uid}/clearance/${dept.id}`).remove();
    await db.ref(`${ROOT}/applications/${uid}/clearance/${dept.name}`).remove();
    await db.ref(`${ROOT}/applications/${uid}/clearanceMeta/${dept.id}`).remove();
    toast('Clearance revoked','ok');
    logAudit('clearance-revoke', `Revoked ${dept.name}`, uid);
  }catch(e){ toast('Failed','err'); }
};

window.saveComplaintResp = async function(id){
  try{
    const response = ($('#cmpResp').value||'').trim();
    const status = $('#cmpNewStatus').value;
    if(!response) return toast('Enter a response','err');

    await db.ref(`${ROOT}/allComplaints/${id}`).update({
      response, status, respondedAt:Date.now(), respondedBy:currentUser.email
    });

    const c = (state.complaints||[]).find(x => x.id === id);
    if(c?.userId){
      const snap = await db.ref(`${ROOT}/complaints/${c.userId}`).get();
      const ud = snap.val() || {};
      for(const key in ud){
        if(ud[key].createdAt === c.createdAt){
          await db.ref(`${ROOT}/complaints/${c.userId}/${key}`).update({ response, status, respondedAt:Date.now() });
          break;
        }
      }
      await db.ref(`${ROOT}/userNotifications/${c.userId}`).push({
        icon:'fa-reply', text:'Reply to complaint: '+response.slice(0,80), timestamp:Date.now(), read:false
      });
    }
    toast('Response sent','ok'); closeModal();
  }catch(e){ toast('Failed','err'); }
};

function pad(s, n){ s = String(s == null ? '' : s); return s.length >= n ? s.slice(0,n) : s + ' '.repeat(n - s.length); }

function renderTevetaFormHTML(t){
  /* Exam series — accepts "MA2026/2026" or similar */
  const exRaw   = String(t.examSeries || '').replace(/\s/g,'');
  const exParts = exRaw.split('/');
  const left    = pad(exParts[0] || '', 4);
  const exSeriesM  = left[0] || '';
  const exSeriesA  = left[1] || '';
  const exSeriesY1 = left.slice(2,4);
  const exSeriesY2 = exParts[1] || '';

  /* TEVETA exam number — 10 boxes */
  const noDigits = pad(t.tevetaExamNo || '', 10).split('');

  /* Year of enrolment — 4 boxes split as YY / YY */
  const enrolRaw = String(t.yearEnrolment || '').replace(/\D/g,'');
  const e1 = enrolRaw.slice(0,2), e2 = enrolRaw.slice(2,4), e3 = enrolRaw.slice(4,6), e4 = enrolRaw.slice(6,8);

  const selectedSubjects = Array.isArray(t.subjects) ? t.subjects
    : (t.subjects && typeof t.subjects === 'object') ? Object.keys(t.subjects).filter(k => t.subjects[k])
    : TEVETA_SUBJECTS.map(s => s.code);

  const mode = t.modeOfStudy || 'Full-time';
  const year = t.yearStudy || 'Second';

  const isApproved  = (t.status||'').toLowerCase() === 'approved';
  const isRejected  = (t.status||'').toLowerCase() === 'rejected';
  const isSubmitted = (t.status||'submitted').toLowerCase() === 'submitted';

  const banner = isApproved
    ? `<div class="teveta-status-banner"><i class="fas fa-check-circle"></i> <strong>Approved</strong> on ${fmtDateTime(t.approvedAt)} by ${esc(t.approvedBy||'')}</div>`
    : isRejected
      ? `<div style="background:#fef2f2;border-left:4px solid #ef4444;padding:12px 14px;border-radius:10px;margin-bottom:18px;font-size:13px;color:#991b1b"><i class="fas fa-times-circle"></i> <strong>Rejected</strong> on ${fmtDateTime(t.rejectedAt)}</div>`
      : `<div style="background:#fef3c7;border-left:4px solid #f59e0b;padding:12px 14px;border-radius:10px;margin-bottom:18px;font-size:13px;color:#92400e"><i class="fas fa-clock"></i> <strong>Awaiting Review</strong> — submitted ${fmtDateTime(t.submittedAt)}</div>`;

  return `
    ${banner}
    <div class="teveta-form-container">
      <div class="form-header">
        <div class="logo-section">
          <img src="teveta.png" alt="TEVETA" onerror="this.style.display='none'" />
          <div class="address-text">
            <strong>Post 4751, Heritage Walk, Lusaka</strong><br />
            P.O. Box 50163, Lusaka, Zambia<br />
            <strong>Tel:</strong> +260-211-255513 / 255519 / 255438<br />
            <strong>Fax:</strong> +260-1-253852<br />
            <strong>Email:</strong> teveta@teveta.org.zm<br />
            <strong>Website:</strong> www.teveta.org.zm
          </div>
        </div>
        <h2>TEVETA EXAMINATION ENTRY FORM</h2>
      </div>

      <div class="form-field">
        <span class="field-number">1.</span>
        <span class="field-label">COURSE:</span>
        <input type="text" class="field-input" value="${esc(t.course||'')}" readonly />
      </div>

      <div class="form-field">
        <span class="field-number">2.</span>
        <span class="field-label">EXAMINATION SERIES:</span>
        <div class="box-group">
          <input type="text" class="box-input readonly" value="${esc(exSeriesM)}" readonly />
          <input type="text" class="box-input readonly" value="${esc(exSeriesA)}" readonly />
          <input type="text" class="box-input readonly" value="${esc(exSeriesY1)}" readonly />
          <span class="box-sep">/</span>
          <input type="text" class="box-input readonly" value="${esc(exSeriesY2)}" readonly />
        </div>
      </div>

      <div class="form-field">
        <span class="field-number">3.</span>
        <span class="field-label">TEVETA EXAM NO:</span>
        <div class="box-group">
          ${noDigits.map(d => `<input type="text" class="box-input readonly" value="${esc(d.trim())}" readonly />`).join('')}
        </div>
      </div>

      <div class="form-field">
        <span class="field-number">4.</span>
        <span class="field-label">EXAMINATION CENTER NAME:</span>
        <input type="text" class="field-input" value="NORTHERN TECHNICAL COLLEGE" readonly />
      </div>

      <div class="form-field">
        <span class="field-number">5.</span>
        <span class="field-label">SURNAME:</span>
        <input type="text" class="field-input" value="${esc(t.surname||'')}" readonly />
      </div>

      <div class="form-field">
        <span class="field-number">6.</span>
        <span class="field-label">FORENAMES:</span>
        <input type="text" class="field-input" value="${esc(t.forenames||'')}" readonly />
      </div>

      <div class="form-field">
        <span class="field-number">7.</span>
        <span class="field-label">INSTITUTION OF STUDY:</span>
        <input type="text" class="field-input" value="NORTHERN TECHNICAL COLLEGE" readonly />
      </div>

      <div class="form-field">
        <span class="field-number">8.</span>
        <span class="field-label">YEAR OF ENROLMENT:</span>
        <div class="box-group">
          <input type="text" class="box-input readonly" value="${esc(e1)}" readonly />
          <input type="text" class="box-input readonly" value="${esc(e2)}" readonly />
          <span class="box-sep">/</span>
          <input type="text" class="box-input readonly" value="${esc(e3)}" readonly />
          <input type="text" class="box-input readonly" value="${esc(e4)}" readonly />
        </div>
      </div>

      <div class="form-field">
        <span class="field-number">9.</span>
        <span class="field-label">Mode of Study:</span>
        <div class="radio-group">
          ${['Full-time','Distance','Workplace','Part-time'].map(m => `
            <label class="radio-opt">
              <input type="radio" ${mode === m ? 'checked' : ''} disabled /><span>${m}</span>
            </label>`).join('')}
        </div>
      </div>

      <div class="form-field">
        <span class="field-number">10.</span>
        <span class="field-label">YEAR OF STUDY</span>
        <div class="radio-group">
          ${['First','Second','Third','Fourth'].map(y => `
            <label class="radio-opt">
              <input type="radio" ${year === y ? 'checked' : ''} disabled /><span>${y}</span>
            </label>`).join('')}
        </div>
      </div>

      <div class="form-field" style="align-items:flex-start">
        <span class="field-number">11.</span>
        <span class="field-label" style="flex:1;min-width:100%">SUBJECTS TO BE TAKEN (Indicate whether practical or written paper)</span>
        <div class="subjects-list">
          ${TEVETA_SUBJECTS.map((s, i) => `
            <div class="subject-row">
              <input type="checkbox" ${selectedSubjects.includes(s.code) ? 'checked' : ''} disabled />
              <span class="subject-text">(${String.fromCharCode(105 + i)}) ${esc(s.code)} ${esc(s.label)}</span>
              <span class="subject-line"></span>
            </div>`).join('')}
          <div class="subject-row"><input type="checkbox" disabled /><span class="subject-text">(ix)</span><span class="subject-line readonly"></span></div>
          <div class="subject-row"><input type="checkbox" disabled /><span class="subject-text">(x)</span><span class="subject-line readonly"></span></div>
        </div>
      </div>

      ${t.candidateSignatureNote ? `<div style="font-size:12px;color:var(--muted);margin-top:10px">${esc(t.candidateSignatureNote)}</div>` : ''}

      <div class="teveta-signature-block">
        ${isApproved ? `<div style="font-size:12px;color:var(--muted);margin-bottom:6px"><i class="fas fa-check-circle" style="color:#10b981"></i> Approved by ${esc(t.approvedBy||'')} on ${fmtDateTime(t.approvedAt)}</div>` : ''}
        <div class="sig-row">
          <div class="sig-col"><div class="sig-line"></div><div class="sig-label">Candidate Signature</div></div>
          <div class="sig-col"><div class="sig-line"></div><div class="sig-label">Date</div></div>
        </div>
        <div class="sig-row">
          <div class="sig-col"><div class="sig-line"></div><div class="sig-label">Examination Officer Signature</div></div>
          <div class="sig-col"><div class="sig-line"></div><div class="sig-label">Date</div></div>
        </div>
      </div>
    </div>`;
}

PAGE_RENDERERS.teveta = function(){

  else if(activeTevetaFilter === 'rejected') list = all.filter(t => (t.status||'').toLowerCase()==='rejected');

  const pendingCount  = all.filter(t => (t.status||'submitted').toLowerCase()==='submitted').length;
  const approvedCount = all.filter(t => (t.status||'').toLowerCase()==='approved').length;
  const rejectedCount = all.filter(t => (t.status||'').toLowerCase()==='rejected').length;

  $('#mainContent').innerHTML = `
    <div class="stats-grid">
      <div class="stat-card blue"><div class="ico"><i class="fas fa-check-double"></i></div><div class="lbl">Total Entries</div><div class="val">${all.length}</div></div>

        <button class="chip ${activeTevetaFilter==='rejected'?'active':''}" onclick="activeTevetaFilter='rejected';renderActive();">Rejected <span class="cnt">${rejectedCount}</span></button>
      </div>
      ${list.length ? `
        <div class="tbl-wrap">
          <table>
            <thead><tr><th>Surname</th><th>Forenames</th><th>TEVETA No.</th><th>Series</th><th>Year</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody>
              ${list.map(t => `
                <tr>
                  <td><strong>${esc(t.surname||'')}</strong></td>
                  <td>${esc(t.forenames||'')}</td>
                  <td>${esc(t.tevetaExamNo||'')}</td>
                  <td>${esc(t.examSeries||'')}</td>
                  <td>${esc(t.yearEnrolment||'')}</td>
                  <td>${statusBadge(t.status||'submitted')}</td>
                  <td style="white-space:nowrap">
                    <button class="btn sm primary" onclick="viewTevetaForm('${t.id}')"><i class="fas fa-eye"></i> View Form</button>
                    ${(t.status||'submitted').toLowerCase()==='submitted' ? `
                      <button class="btn sm green" onclick="approveTeveta('${t.id}')"><i class="fas fa-check"></i></button>
                      <button class="btn sm red" onclick="rejectTeveta('${t.id}')"><i class="fas fa-times"></i></button>` : ''}
                  </td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>`

window.viewTevetaForm = function(id){
  const t = (state.teveta||[]).find(x => x.id === id);
  if(!t) return;
  const isSubmitted = (t.status||'submitted').toLowerCase() === 'submitted';

  openModal({
    title:'TEVETA Examination Entry Form',
    icon:'fa-check-double',
    size:'860px',
    body: renderTevetaFormHTML(t),
    foot: `
      <button class="btn ghost" onclick="closeModal()">Close</button>
      <button class="btn primary" onclick="printTeveta('${id}')"><i class="fas fa-print"></i> Print</button>
      ${isSubmitted ? `
        <button class="btn red" onclick="rejectTeveta('${id}');closeModal();"><i class="fas fa-times"></i> Reject</button>
        <button class="btn green" onclick="approveTeveta('${id}');closeModal();"><i class="fas fa-check"></i> Approve</button>` : ''}
    `
  });
};

window.printTeveta = function(id){
  const t = (state.teveta||[]).find(x => x.id === id);
  if(!t) return;
  const w = window.open('', '_blank', 'width=900,height=1000');
  if(!w){ toast('Allow pop-ups to print','err'); return; }

  w.document.close();
  setTimeout(() => { try{ w.focus(); w.print(); }catch(e){} }, 500);
};

window.sendNotification = async function(){
  const recipient = $('#nfRecipient').value;
  const title = ($('#nfTitle').value||'').trim();
  const message = ($('#nfBody').value||'').trim();
  if(!title || !message) return toast('Fill in title and message','err');
  try{
    await db.ref(`${ROOT}/inAppNotifications`).push({
      title, message, recipientType:recipient,
      createdAt:Date.now(), createdBy:currentUser.email, active:true
    });
    const targets = (state.applications||[]).filter(a => {
      if(recipient === 'approved') return (a.status||'').toLowerCase()==='approved';
      if(recipient === 'pending')  return (a.status||'pending').toLowerCase()==='pending';
      return true;
    });
    for(const t of targets){
      await db.ref(`${ROOT}/userNotifications/${t.id}`).push({
        icon:'fa-bell', text:title+': '+message, timestamp:Date.now(), read:false
      });
    }
    toast(`Sent to ${targets.length} students`,'ok');
    $('#nfTitle').value = ''; $('#nfBody').value = '';
  }catch(e){ toast('Failed','err'); }
};

      <div class="card">
        <h3><i class="fas fa-circle-info"></i> How staff logins work</h3>
        <p style="color:var(--muted);font-size:13px;line-height:1.8">
          1. Click <b>Create Staff Login</b> and enter the staff member's <b>unique email</b>, a temporary password, their role and department(s).<br>
          2. A Firebase Authentication account is created immediately using a secondary app instance — <b>you stay signed in</b>.<br>
          3. The staff record is stored under <code>nortec/staff/{uid}</code> and indexed by email.<br>
          4. The staff member signs in at this page with that email + password and lands on <b>their own dashboard</b>,
             showing only the modules and departments their role allows.<br>
          5. Change the role or department(s) at any time using the <b>edit</b> button.
        </p>
      </div>` : ''}
  `;
};

window.addStaff = function(){

    title:'Create Staff Login', icon:'fa-user-plus', size:'600px',
    body:`
      <div class="form-group"><label>Full Name</label><input id="stName" placeholder="Jane Banda"/></div>
      <div class="form-group">
        <label>Unique Email</label>
        <input id="stEmail" type="email" placeholder="jane.banda@nortec.edu.zm"/>
        <div class="hint">This email becomes their login. It must be unique.</div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Temporary Password</label><input id="stPass" type="text" value="Nortec@${new Date().getFullYear()}"/></div>
        <div class="form-group"><label>Role</label>
          <select id="stRole" onchange="syncDeptDefaults()">
            ${Object.keys(ROLES).map(r => `<option value="${esc(r)}">${esc(r)}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Departments (they can clear students in these)</label>
        <div id="stDeptBox" style="display:flex;flex-wrap:wrap;gap:8px;padding:10px;background:var(--soft);border-radius:10px;border:1.5px solid var(--border)">
          ${DEPARTMENTS.map(d => `
            <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;cursor:pointer">
              <input type="checkbox" class="stDeptChk" value="${d.id}"/> <i class="fas ${d.icon}" style="color:var(--blue)"></i> ${esc(d.name)}
            </label>`).join('')}

        </label>
      </div>`,
    foot:`<button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn primary" id="stSaveBtn" onclick="createStaffAccount()"><i class="fas fa-user-plus"></i> Create Login</button>`

window.syncDeptDefaults = function(){
  const role = $('#stRole')?.value;
  const defaults = (ROLES[role] || {}).departments || [];
  $$('.stDeptChk').forEach(chk => { chk.checked = defaults.includes(chk.value); });
};

window.createStaffAccount = async function(){
  const name  = ($('#stName').value||'').trim();
  const email = ($('#stEmail').value||'').trim().toLowerCase();
  const pass  = ($('#stPass').value||'').trim();
  const role  = $('#stRole').value;
  const active = $('#stActive').checked;
  const departments = $$('.stDeptChk').filter(c => c.checked).map(c => c.value);

  if(!name)  return toast('Enter the staff name','err');
  if(!email) return toast('Enter a unique email','err');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return toast('Enter a valid email','err');
  if(pass.length < 6) return toast('Password must be at least 6 characters','err');

  const btn = $('#stSaveBtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating…';

  try{
    /* Check for duplicate email in our own index */
    const dup = await db.ref(`${ROOT}/staffEmailIndex/${emailKey(email)}`).get();
    if(dup.exists()){
      btn.disabled = false; btn.innerHTML = '<i class="fas fa-user-plus"></i> Create Login';
      return toast('That email is already used by another staff member','err');
    }

    /* Create the Auth user on the SECONDARY app — admin stays signed in */
    const cred = await staffAuth.createUserWithEmailAndPassword(email, pass);
    const uid  = cred.user.uid;

    const record = {
      name, email, role,
      departments,
      department: departments[0] || '',
      active,
      uid,
      createdAt: Date.now(),
      createdBy: currentUser.email
    };

    await db.ref(`${ROOT}/staff/${uid}`).set(record);
    await db.ref(`${ROOT}/staffEmailIndex/${emailKey(email)}`).set({ uid, name, email, role });
    await db.ref(`${ROOT}/userNotifications/${uid}`).push({
      icon:'fa-user-plus', text:'Welcome to NORTEC Staff Portal', timestamp:Date.now(), read:false
    });

    await staffAuth.signOut();
    toast('Staff login created for ' + email,'ok');
    logAudit('create-staff', 'Created staff ' + email + ' (' + role + ')', uid);
    closeModal();
  }catch(e){
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-user-plus"></i> Create Login';
    const msg = String(e.message||'').replace('Firebase: ','');
    toast(msg.includes('already-in-use') ? 'That email already has a login' : msg, 'err');
  }
};

window.editStaff = function(id){
  const s = (state.staff||[]).find(x => x.id === id);
  if(!s) return;
  const depts = Array.isArray(s.departments) && s.departments.length
    ? s.departments
    : [s.department].filter(Boolean);

  openModal({
    title:'Edit Staff', icon:'fa-pen', size:'600px',
    body:`
      <div class="form-group"><label>Name</label><input id="stName" value="${esc(s.name||'')}"/></div>
      <div class="form-group"><label>Email (login)</label><input id="stEmail" value="${esc(s.email||'')}" readonly/></div>
      <div class="form-row">
        <div class="form-group"><label>Role</label>
          <select id="stRole">
            ${Object.keys(ROLES).map(r => `<option ${s.role===r?'selected':''}>${esc(r)}</option>`).join('')}
          </select>
        </div>
        <div class="form-group"><label>Status</label>
          <select id="stActive">
            <option value="true" ${s.active!==false?'selected':''}>Active</option>
            <option value="false" ${s.active===false?'selected':''}>Disabled</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Departments</label>
        <div style="display:flex;flex-wrap:wrap;gap:8px;padding:10px;background:var(--soft);border-radius:10px;border:1.5px solid var(--border)">
          ${DEPARTMENTS.map(d => `
            <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;cursor:pointer">
              <input type="checkbox" class="stDeptChk" value="${d.id}" ${depts.includes(d.id)?'checked':''}/> <i class="fas ${d.icon}" style="color:var(--blue)"></i> ${esc(d.name)}
            </label>`).join('')}
        </div>
      </div>`,
    foot:`<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="updateStaff('${id}')">Update</button>`
  });
};

window.updateStaff = async function(id){
  try{
    const departments = $$('.stDeptChk').filter(c => c.checked).map(c => c.value);
    const active = $('#stActive').value === 'true';
    await db.ref(`${ROOT}/staff/${id}`).update({
      name: ($('#stName').value||'').trim(),
      role: $('#stRole').value,
      departments,
      department: departments[0] || '',
      active,
      updatedAt: Date.now(),
      updatedBy: currentUser.email
    });
    toast('Updated','ok');
    logAudit('update-staff', 'Updated staff record ' + id, id);
    closeModal();
  }catch(e){ toast('Failed','err'); }
};

window.toggleStaffActive = async function(id, makeActive){
  try{
    await db.ref(`${ROOT}/staff/${id}`).update({ active: makeActive, updatedAt: Date.now() });
    toast(makeActive ? 'Account enabled' : 'Account disabled','ok');
    logAudit('toggle-staff', (makeActive?'Enabled ':'Disabled ')+id, id);
  }catch(e){ toast('Failed','err'); }
};

window.deleteStaff = async function(id){
  const s = (state.staff||[]).find(x => x.id === id);
  if(!confirm('Delete this staff record? The Firebase login will remain but they will lose admin access.')) return;
  try{
    if(s?.email) await db.ref(`${ROOT}/staffEmailIndex/${emailKey(s.email)}`).remove();
    await db.ref(`${ROOT}/staff/${id}`).remove();
    toast('Deleted','ok');
    logAudit('delete-staff', 'Deleted staff ' + (s?.email||id), id);
  }catch(e){ toast('Failed','err'); }
};

        <button class="btn primary" onclick="exportCSV('applications')"><i class="fas fa-download"></i> Applications</button>
        <button class="btn primary" onclick="exportCSV('payments')"><i class="fas fa-download"></i> Payments</button>
        <button class="btn primary" onclick="exportCSV('complaints')"><i class="fas fa-download"></i> Complaints</button>
      </div>
    </div>`;
  setTimeout(() => { try { renderDashboardCharts(); }catch(e){} }, 100);

window.exportCSV = function(type){
  let rows = [];
  if(type === 'students' || type === 'applications'){
    rows = [['Student No.','Name','Email','Phone','Programme','Intake','Status','Submitted']];
    (state.applications||[]).forEach(a => rows.push([
      a.studentNumber||'', a.fullName||'', a.email||'', a.phone||'',
      a.programme?.title||'', a.programme?.intakeLabel||'', a.status||'pending', fmtDate(a.submittedAt)
    ]));
  } else if(type === 'payments'){
    rows = [['Student','Item','Amount','Type','Status','Date']];
    (state.transactions||[]).forEach(t => rows.push([
      t.userName||t.userEmail||'', t.itemTitle||'', t.amount||0, t.itemType||'', t.status||'pending', fmtDate(t.timestamp)
    ]));
  } else if(type === 'complaints'){
    rows = [['Student','Subject','Category','Status','Submitted']];
    (state.complaints||[]).forEach(c => rows.push([
      c.studentName||'', c.subject||'', c.category||'', c.status||'', fmtDate(c.createdAt)
    ]));
  }
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type:'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `nortec-${type}-${Date.now()}.csv`;
  a.click();
  toast('Downloaded','ok');
};

window.clearAudit = async function(){
  if(!confirm('Clear all audit logs?')) return;
  try{ await db.ref(`${ROOT}/auditLogs`).remove(); toast('Cleared','ok'); }
  catch(e){ toast('Failed','err'); }
};

/* ───── BACKUP ───── */
PAGE_RENDERERS.backup = function(){
  $('#mainContent').innerHTML = `
    <div class="card">
      <h3><i class="fas fa-database"></i> Backup & Recovery</h3>
      <p style="color:var(--muted);font-size:13px;margin-bottom:16px">Export a full data backup or restore from a previous backup file.</p>
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        <button class="btn primary" onclick="backupData()"><i class="fas fa-download"></i> Export Full Backup</button>
        <button class="btn ghost" onclick="document.getElementById('backupFile').click()"><i class="fas fa-upload"></i> Import Backup</button>
        <input type="file" id="backupFile" accept=".json" style="display:none"/>
      </div>
    </div>`;
  $('#backupFile')?.addEventListener('change', importBackup);
};

window.backupData = async function(){
  try{
    const snap = await db.ref(ROOT).get();
    const blob = new Blob([JSON.stringify(snap.val()||{}, null, 2)], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `nortec-backup-${Date.now()}.json`;
    a.click();
    toast('Backup downloaded','ok');
    logAudit('backup','Backup exported');
  }catch(e){ toast('Failed','err'); }
};

window.importBackup = async function(e){
  const file = e.target.files[0];
  if(!file) return;
  if(!confirm('Overwrite ALL data? This cannot be undone.')) return;
  try{
    const data = JSON.parse(await file.text());
    await db.ref(ROOT).set(data);
    toast('Imported','ok');
    logAudit('restore','Backup imported');
  }catch(err){ toast('Failed: '+err.message,'err'); }
};
