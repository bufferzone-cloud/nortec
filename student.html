<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>NORTEC · Student Dashboard</title>
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="NORTEC Student" />
<meta name="theme-color" content="#1e40af" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://upload-widget.cloudinary.com/global/all.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;-webkit-tap-highlight-color:transparent}
  :root{
    --blue:#2563eb; --blue-dark:#1e40af; --blue-light:#eff6ff; --blue-soft:#dbeafe; --blue-bright:#3b82f6;
    --green:#10b981; --red:#ef4444; --amber:#f59e0b; --purple:#8b5cf6;
    --bg-primary:#0a0e17; --bg-secondary:#f8fafc; --bg-card:#ffffff;
    --text-primary:#0f172a; --text-secondary:#1e293b; --text-muted:#64748b;
    --border-color:#e2e8f0;
    --header-bg:rgba(255,255,255,.82);
    --sidebar-bg:rgba(255,255,255,.96);
    --input-bg:#f8fafc;
    --glass-blur:blur(20px);
    --mac-shadow:0 12px 48px rgba(0,0,0,.12),0 4px 16px rgba(0,0,0,.04);
    --mac-shadow-hover:0 20px 60px rgba(0,0,0,.16),0 8px 24px rgba(0,0,0,.06);
    --radius:14px;
  }
  html,body{width:100%;height:100%;background:var(--bg-secondary);color:var(--text-primary);overflow:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}

  #appLoader{position:fixed;inset:0;background:var(--bg-primary);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .4s}
  #appLoader.hidden{opacity:0;pointer-events:none}
  .loader-spinner{width:52px;height:52px;border:4px solid rgba(255,255,255,.15);border-top-color:var(--blue-bright);border-radius:50%;animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .app-root{display:flex;flex-direction:column;height:100dvh;width:100%;overflow:hidden;position:relative;background:var(--bg-secondary)}

  .top-bar{background:var(--header-bg);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border-bottom:1px solid rgba(37,99,235,.15);padding:12px 18px;display:flex;align-items:center;gap:10px;flex-shrink:0;position:relative;z-index:40;min-height:64px;box-shadow:0 2px 20px rgba(37,99,235,.06)}
  .header-left{display:flex;align-items:center;gap:10px}
  .header-logo{width:44px;height:44px;object-fit:contain;border-radius:10px;background:var(--blue-light);padding:4px;cursor:pointer;transition:transform .2s;border:1px solid var(--blue-soft)}
  .header-logo:hover{transform:scale(1.05)}
  .header-center{flex:1;text-align:center;min-width:0}
  .header-center .greeting{font-size:10px;font-weight:700;color:var(--text-muted);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:2px}
  .header-center .name{font-size:16px;font-weight:800;color:var(--text-primary);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .header-center .name .accent{color:var(--blue)}
  .header-right{display:flex;align-items:center;gap:8px}
  .btn-icon{background:rgba(255,255,255,.7);backdrop-filter:blur(8px);border:1px solid rgba(37,99,235,.15);color:var(--blue);width:42px;height:42px;border-radius:12px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;position:relative;box-shadow:0 2px 8px rgba(0,0,0,.04)}
  .btn-icon:hover{background:var(--blue-soft);transform:scale(1.04)}
  .btn-icon .badge{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:10px;font-weight:800;border-radius:30px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid #fff}
  .btn-icon .badge[data-count="0"]{display:none}

  .app-content{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0;-webkit-overflow-scrolling:touch;scroll-behavior:smooth;position:relative;padding-bottom:90px}
  .app-content::-webkit-scrollbar{width:5px}
  .app-content::-webkit-scrollbar-thumb{background:rgba(37,99,235,.3);border-radius:20px}

  .page-container{display:none;width:100%;opacity:0;transform:translateX(24px) scale(.98);transition:opacity .35s cubic-bezier(.22,1,.36,1),transform .35s cubic-bezier(.22,1,.36,1);pointer-events:none;position:absolute;top:0;left:0;min-height:100%}
  .page-container.active-page{display:block;opacity:1;transform:none;pointer-events:auto;position:relative;animation:pageIn .4s cubic-bezier(.22,1,.36,1)}
  @keyframes pageIn{from{opacity:0;transform:translateX(24px) scale(.98)}to{opacity:1;transform:none}}
  .full-page{padding:16px 18px 30px}

  .welcome-banner{background:linear-gradient(135deg,#1e40af,#2563eb);border-radius:20px;padding:22px 24px;color:#fff;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;box-shadow:0 8px 32px rgba(37,99,235,.30);position:relative;overflow:hidden;margin-bottom:16px}
  .welcome-banner::before{content:'';position:absolute;top:-40%;right:-15%;width:220px;height:220px;background:rgba(255,255,255,.08);border-radius:50%;pointer-events:none}
  .welcome-banner .wb-left{position:relative;z-index:1}
  .welcome-banner .wb-left .hi{font-size:13px;opacity:.85;font-weight:500}
  .welcome-banner .wb-left .nm{font-size:22px;font-weight:900;margin-top:2px}
  .welcome-banner .wb-left .meta{font-size:12px;opacity:.8;margin-top:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .welcome-banner .wb-left .meta .chip{background:rgba(255,255,255,.18);padding:3px 10px;border-radius:30px;font-size:11px;font-weight:700}
  .welcome-banner .wb-right{text-align:right;position:relative;z-index:1}
  .welcome-banner .wb-right .lbl{font-size:11px;opacity:.75;text-transform:uppercase;letter-spacing:1px;font-weight:600}
  .welcome-banner .wb-right .val{font-size:26px;font-weight:900;line-height:1.1}
  .welcome-banner .wb-right .sub{font-size:11px;opacity:.75}

  .section-title{font-size:15px;font-weight:800;color:var(--text-primary);margin:18px 0 12px;display:flex;align-items:center;gap:8px}
  .section-title i{color:var(--blue)}
  .section-title .count{margin-left:auto;font-size:11px;background:var(--blue-light);color:var(--blue-dark);padding:3px 12px;border-radius:30px;font-weight:700}

  .grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .card-tile{background:#fff;border-radius:16px;padding:16px 14px;border:1px solid rgba(226,232,240,.5);box-shadow:0 4px 16px rgba(0,0,0,.04);transition:all .25s;cursor:pointer;position:relative;overflow:hidden}
  .card-tile:hover{transform:translateY(-3px);box-shadow:var(--mac-shadow);border-color:rgba(37,99,235,.2)}
  .card-tile .icon{font-size:24px;margin-bottom:8px;display:block}
  .card-tile .ttl{font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px}
  .card-tile .val{font-size:20px;font-weight:900;color:var(--text-primary);margin-top:2px;line-height:1.15}
  .card-tile .sub{font-size:11px;color:var(--text-muted);margin-top:2px}
  .card-tile.blue{background:linear-gradient(135deg,#eff6ff,#ffffff);border-color:#bfdbfe}
  .card-tile.green{background:linear-gradient(135deg,#f0fdf4,#ffffff);border-color:#bbf7d0}
  .card-tile.amber{background:linear-gradient(135deg,#fffbeb,#ffffff);border-color:#fcd34d}
  .card-tile.red{background:linear-gradient(135deg,#fef2f2,#ffffff);border-color:#fecaca}
  .card-tile.purple{background:linear-gradient(135deg,#f5f3ff,#ffffff);border-color:#ddd6fe}

  .quick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:6px}
  .quick-btn{background:#fff;border:1.5px solid var(--border-color);border-radius:14px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;transition:all .2s;font-family:inherit;color:var(--text-primary);font-size:11.5px;font-weight:700;text-align:center;line-height:1.2}
  .quick-btn:hover{background:var(--blue-light);border-color:var(--blue);color:var(--blue-dark);transform:translateY(-2px)}
  .quick-btn i{font-size:20px;color:var(--blue)}

  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:12px}
  .stat-box{background:#fff;border:1px solid var(--border-color);border-radius:14px;padding:14px;text-align:center}
  .stat-box .lbl{font-size:10.5px;color:var(--text-muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
  .stat-box .val{font-size:20px;font-weight:900;color:var(--text-primary);margin-top:4px}

  .sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);z-index:600;opacity:0;visibility:hidden;transition:all .35s}
  .sidebar-overlay.active{opacity:1;visibility:visible}
  .sidebar{position:fixed;top:0;right:-340px;width:300px;height:100dvh;background:var(--sidebar-bg);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);z-index:700;transition:right .4s cubic-bezier(.22,1,.36,1);box-shadow:-10px 0 40px rgba(37,99,235,.12);display:flex;flex-direction:column;overflow-y:auto;border-left:1px solid rgba(255,255,255,.4)}
  .sidebar.open{right:0}
  .sidebar-head{padding:20px 22px 16px;border-bottom:2px solid rgba(37,99,235,.15);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--sidebar-bg);backdrop-filter:blur(20px);z-index:5}
  .sidebar-head h2{font-size:18px;font-weight:900;color:var(--text-primary)}
  .sidebar-head h2 .accent{color:var(--blue)}
  .sidebar-close{background:rgba(255,255,255,.7);border:1px solid var(--border-color);width:36px;height:36px;border-radius:50%;font-size:16px;color:var(--text-primary);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
  .sidebar-close:hover{background:var(--blue-soft);transform:scale(1.05)}
  .sidebar-nav{padding:8px 0;flex:1}
  .nav-item{display:flex;align-items:center;gap:14px;padding:13px 22px;background:none;border:none;width:100%;text-align:left;font-size:14.5px;font-weight:600;color:var(--text-secondary);cursor:pointer;transition:.2s;font-family:inherit;border-left:4px solid transparent}
  .nav-item:hover{background:var(--blue-light);color:var(--blue-dark);padding-left:26px}
  .nav-item.active{background:var(--blue-light);color:var(--blue-dark);border-left-color:var(--blue);font-weight:700}
  .nav-item i{width:24px;text-align:center;color:var(--blue);font-size:17px;flex-shrink:0}
  .nav-item.logout{color:var(--red);border-top:1px solid var(--border-color);margin-top:8px}
  .nav-item.logout i{color:var(--red)}
  .nav-item.logout:hover{background:#fef2f2;color:#991b1b}

  .sub-page{display:none;position:fixed;inset:0;z-index:100;background:var(--bg-secondary);overflow-y:auto;animation:slideIn .35s ease}
  @keyframes slideIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
  .sub-page.active{display:block}
  .sub-head{background:var(--header-bg);backdrop-filter:var(--glass-blur);padding:14px 18px;border-bottom:1px solid rgba(37,99,235,.12);display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5;box-shadow:0 2px 12px rgba(37,99,235,.04)}
  .sub-head img{width:40px;height:40px;object-fit:contain;border-radius:8px;background:var(--blue-light);padding:4px;border:1px solid var(--blue-soft)}
  .sub-head h2{font-size:17px;font-weight:800;color:var(--text-primary);flex:1;line-height:1.2}
  .sub-head h2 .accent{color:var(--blue)}
  .sub-close{background:rgba(255,255,255,.7);border:1px solid var(--border-color);width:36px;height:36px;border-radius:50%;font-size:16px;color:var(--text-primary);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
  .sub-close:hover{background:var(--blue-soft);transform:scale(1.05)}
  .sub-body{padding:20px 18px 40px;max-width:900px;margin:0 auto}
  .sub-body h3{font-size:15px;font-weight:800;color:var(--text-primary);margin:20px 0 12px;display:flex;align-items:center;gap:8px;padding-bottom:8px;border-bottom:2px solid rgba(37,99,235,.15)}
  .sub-body h3:first-child{margin-top:0}
  .sub-body h3 i{color:var(--blue)}
  .sub-body p{line-height:1.7;color:#334155;margin-bottom:8px;font-size:14px}
  .sub-body ul,.sub-body ol{padding-left:20px;margin:8px 0 12px;color:#334155;line-height:1.75;font-size:13.5px}

  .tbl-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--border-color);margin:12px 0;background:#fff}
  table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
  th{background:var(--blue-light);text-align:left;padding:11px 12px;font-weight:800;color:var(--blue-dark);text-transform:uppercase;font-size:10.5px;letter-spacing:.5px;white-space:nowrap;border-bottom:2px solid var(--blue)}
  td{padding:10px 12px;border-bottom:1px solid var(--border-color);color:#334155;vertical-align:top}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--blue-light)}

  .badge{display:inline-block;padding:3px 12px;border-radius:30px;font-size:10.5px;font-weight:800;letter-spacing:.3px;text-transform:uppercase}
  .badge.green{background:#d1fae5;color:#065f46}
  .badge.red{background:#fee2e2;color:#991b1b}
  .badge.amber{background:#fef3c7;color:#92400e}
  .badge.blue{background:var(--blue-soft);color:var(--blue-dark)}
  .badge.purple{background:#ede9fe;color:#5b21b6}
  .badge.grey{background:#f1f5f9;color:#475569}

  .info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:12px 0}
  .info-item{background:#fff;border:1px solid var(--border-color);border-radius:12px;padding:12px 14px}
  .info-item .lbl{font-size:11px;color:var(--text-muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
  .info-item .val{font-size:14px;font-weight:700;color:var(--text-primary);margin-top:4px;word-break:break-word}

  .id-card{max-width:400px;margin:0 auto;background:linear-gradient(135deg,#1e40af,#3b82f6);border-radius:22px;padding:24px;color:#fff;box-shadow:0 20px 60px rgba(37,99,235,.35);position:relative;overflow:hidden}
  .id-card::before{content:'';position:absolute;top:-50%;right:-30%;width:220px;height:220px;background:rgba(255,255,255,.06);border-radius:50%}
  .id-card::after{content:'';position:absolute;bottom:-40%;left:-20%;width:180px;height:180px;background:rgba(255,255,255,.04);border-radius:50%}
  .id-card .id-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;position:relative;z-index:1}
  .id-card .id-hd img{width:48px;height:48px;object-fit:contain;border-radius:10px;background:rgba(255,255,255,.18);padding:4px}
  .id-card .id-hd .ttl{font-weight:900;font-size:14px;letter-spacing:.5px;text-align:right}
  .id-card .id-hd .ttl small{display:block;font-size:9px;opacity:.75;font-weight:500;margin-top:2px;letter-spacing:1.2px}
  .id-card .id-photo{width:88px;height:88px;border-radius:50%;background:rgba(255,255,255,.18);margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:36px;border:3px solid rgba(255,255,255,.35);overflow:hidden;position:relative;z-index:1}
  .id-card .id-photo img{width:100%;height:100%;object-fit:cover}
  .id-card .id-name{text-align:center;font-size:20px;font-weight:900;margin-bottom:4px;position:relative;z-index:1}
  .id-card .id-num{text-align:center;font-size:12px;opacity:.9;letter-spacing:2px;font-weight:700;margin-bottom:12px;position:relative;z-index:1}
  .id-card .id-details{text-align:center;font-size:12px;opacity:.9;line-height:1.7;position:relative;z-index:1}
  .id-card .id-qr{display:flex;justify-content:center;margin-top:16px;position:relative;z-index:1}
  .id-card .id-qr #qrcode{background:#fff;padding:10px;border-radius:12px}
  .id-card .id-ft{display:flex;justify-content:space-between;margin-top:14px;font-size:10px;opacity:.75;border-top:1px solid rgba(255,255,255,.2);padding-top:10px;position:relative;z-index:1}

  .btn-sm{padding:10px 20px;border-radius:50px;border:none;font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px;transition:.2s}
  .btn-sm.primary{background:linear-gradient(135deg,var(--blue),var(--blue-dark));color:#fff;box-shadow:0 4px 16px rgba(37,99,235,.25)}
  .btn-sm.primary:hover{transform:translateY(-2px);box-shadow:0 6px 22px rgba(37,99,235,.35)}
  .btn-sm.ghost{background:#f1f5f9;color:var(--text-primary)}
  .btn-sm.ghost:hover{background:#e2e8f0}
  .btn-sm.green{background:linear-gradient(135deg,#10b981,#059669);color:#fff}
  .btn-sm.red{background:linear-gradient(135deg,#ef4444,#b91c1c);color:#fff}

  .btn-full{width:100%;padding:14px;border-radius:50px;border:none;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.2s;margin-top:10px}
  .btn-full.primary{background:linear-gradient(135deg,var(--blue),var(--blue-dark));color:#fff;box-shadow:0 4px 16px rgba(37,99,235,.25)}
  .btn-full.primary:hover{transform:translateY(-2px);box-shadow:0 6px 22px rgba(37,99,235,.35)}
  .btn-full.ghost{background:#f1f5f9;color:var(--text-primary);border:1.5px solid var(--border-color)}
  .btn-full.ghost:hover{background:#e2e8f0}
  .btn-full.danger{background:linear-gradient(135deg,#ef4444,#b91c1c);color:#fff}

  .form-group{margin-bottom:14px}
  .form-group label{display:block;font-size:12px;font-weight:700;color:#334155;margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
  .form-group input,.form-group select,.form-group textarea{width:100%;padding:12px 14px;border:1.5px solid var(--border-color);border-radius:12px;font-family:inherit;font-size:14px;background:var(--input-bg);color:var(--text-primary);transition:.2s;outline:none}
  .form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
  .form-group textarea{resize:vertical;min-height:80px;line-height:1.5}

  .empty{padding:36px 20px;text-align:center;color:var(--text-muted);font-size:13px;background:#fff;border-radius:14px;border:1px dashed var(--border-color)}
  .empty i{font-size:32px;display:block;margin-bottom:10px;opacity:.35}

  .prog{height:8px;background:#e2e8f0;border-radius:20px;overflow:hidden;margin-top:6px}
  .prog>div{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--blue),var(--blue-bright));transition:width .5s ease}
  .prog.green>div{background:linear-gradient(90deg,#10b981,#059669)}
  .prog.amber>div{background:linear-gradient(90deg,#f59e0b,#d97706)}
  .prog.red>div{background:linear-gradient(90deg,#ef4444,#b91c1c)}

  .timeline{position:relative;padding-left:24px;margin:12px 0}
  .timeline::before{content:'';position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--border-color);border-radius:2px}
  .tl-item{position:relative;padding-bottom:14px}
  .tl-item::before{content:'';position:absolute;left:-20px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 0 0 2px var(--blue)}
  .tl-item.done::before{background:var(--green);box-shadow:0 0 0 2px var(--green)}
  .tl-item.pending::before{background:var(--amber);box-shadow:0 0 0 2px var(--amber)}
  .tl-item .tl-ttl{font-weight:700;font-size:13.5px;color:var(--text-primary)}
  .tl-item .tl-desc{font-size:12px;color:var(--text-muted);margin-top:2px;line-height:1.5}

  #toast{position:fixed;top:76px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:10px;max-width:340px}

  const ico = type==='ok'?'fa-circle-check':type==='err'?'fa-circle-exclamation':'fa-circle-info';

  $('#toast').appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(()=>el.remove(),300);},3500);
}
function getInitials(name){
  if(!name) return 'ST';
  const p = name.trim().split(/\s+/);
  return ((p[0]?.[0]||'')+(p[1]?.[0]||'')).toUpperCase() || 'ST';
}
function getFirstName(name){ return name ? name.trim().split(/\s+/)[0] : 'Student'; }
function skeleton(n=3){ return '<div class="loading-skeleton"></div>'.repeat(n); }
function emptyState(msg, icon='fa-inbox'){ return `<div class="empty"><i class="fas ${icon}"></i>${esc(msg)}</div>`; }

async function openCloudinaryUpload({ formats=['jpg','jpeg','png','pdf','heic','doc','docx'], maxSize=5000000 } = {}){
  return new Promise((resolve) => {
    let done = false;
    const w = cloudinary.createUploadWidget({
      cloudName: CLOUD_NAME, uploadPreset: UPLOAD_PRESET,
      sources: ['local','camera'], multiple:false, maxFileSize:maxSize,
      clientAllowedFormats: formats, folder:'nortec/uploads',
      showAdvancedOptions:false, cropping:false
    }, (err, res) => {
      if (err) return;
      if (res && res.event === 'success' && !done){
        done = true;
        resolve({ url:res.info.secure_url, format:res.info.format, originalFilename:res.info.original_filename, bytes:res.info.bytes });
        try{ w.close({quiet:true}); }catch(e){}
      }
    });
    w.open();
  });
}

function showPage(pageId){
  $$('.page-container').forEach(p => p.classList.remove('active-page','page-leaving'));
  const target = $('#' + pageId + 'Page');
  if(!target) return;
  target.classList.add('active-page');
  $('#appContent').scrollTop = 0;

  $$('.bn-item').forEach(b => b.classList.toggle('active', b.dataset.nav === pageId));
  $$('.sidebar .nav-item').forEach(b => b.classList.toggle('active', b.dataset.page === pageId));

  const renderer = PAGE_RENDERERS[pageId];

}

function renderRecentActivity(){
  const items = [];
  // Latest assessment responses
  allAssessmentResponses
    .filter(r => r.userId === currentUser?.uid && r.submittedAt)
    .sort((a,b) => (b.submittedAt||0) - (a.submittedAt||0))
    .slice(0, 3)
    .forEach(r => {
      const a = allAssessments.find(x => x.id === r.assessmentId);
      if(a) items.push({ type:'done', ttl:`${a.name} — submitted`, desc: fmtDateTime(r.submittedAt) });
    });
  // Latest transactions
  allUserTransactions
    .sort((a,b) => (b.timestamp||0) - (a.timestamp||0))
    .slice(0, 2)
    .forEach(t => {
      items.push({ type: t.status === 'approved' ? 'done':'pending', ttl: `Payment: ${t.itemTitle || 'Item'}`, desc: `ZMW ${t.amount || 0} · ${fmtDate(t.timestamp)}` });
    });
  // Latest notices
  dbNotices.slice(0, 2).forEach(n => {
    items.push({ type:'pending', ttl: n.title || 'Notice', desc: n.body ? n.body.slice(0,80) + (n.body.length>80?'…':'') : '' });
  });
  if(!items.length) return emptyState('No recent activity yet', 'fa-clock');
  return items.map(i => `
    <div class="tl-item ${i.type||''}">
      <div class="tl-ttl">${esc(i.ttl)}</div>
      <div class="tl-desc">${esc(i.desc)}</div>
    </div>
  `).join('');
}

    <h3><i class="fas fa-search"></i> Search Catalog</h3>
    <div class="form-group"><input type="text" id="libSearch" placeholder="Search by title or author…" /></div>
    <h3><i class="fas fa-book"></i> Available Books</h3>
    <div id="libBooks">${renderBookList(books)}</div>
    <h3><i class="fas fa-bookmark"></i> My Borrowed Books</h3>
    <div>${borrowed.length ? borrowed.map(b => `
      <div class="book-card">
        <div class="bk-icon"><i class="fas fa-book"></i></div>
        <div class="bk-body">
          <h4>${esc(b.title||'—')}</h4>

          <div class="meta"><span><i class="fas fa-clock"></i> Due: ${esc(b.due || '—')}</span></div>
        </div>
      </div>
    `).join('') : emptyState('No books borrowed', 'fa-bookmark')}</div>
  `;
  $('#libraryContent').innerHTML = html;
  $('#libSearch')?.addEventListener('input', function(){
    const q = this.value.toLowerCase();
    const filtered = books.filter(b => (b.title||'').toLowerCase().includes(q) || (b.author||'').toLowerCase().includes(q));
    $('#libBooks').innerHTML = renderBookList(filtered);
  });
}
function renderBookList(books){
  if(!books.length) return emptyState('No books found', 'fa-search');
  return books.map(b => `
    <div class="book-card">
      <div class="bk-icon"><i class="fas fa-book${b.available===false?'':' -open'}"></i></div>
      <div class="bk-body">
        <h4>${esc(b.title||'—')}</h4>
        <div class="au">${esc(b.author||'')}</div>
        <div class="meta">
          ${b.isbn ? `<span><i class="fas fa-barcode"></i> ${esc(b.isbn)}</span>` : ''}
          <span class="badge ${b.available===false?'red':'green'}">${b.available===false?'Borrowed':'In Library'}</span>
        </div>
      </div>
    </div>
  `).join('');
}

function renderCareers(){
  const jobs = dbJobs;
  const alumni = dbAlumni;
  let html = `
    <div class="info-grid">
      <div class="info-item"><div class="lbl">Open Positions</div><div class="val">${jobs.length}</div></div>
      <div class="info-item"><div class="lbl">Applied</div><div class="val">${dbJobApplications.length}</div></div>
      <div class="info-item"><div class="lbl">Saved</div><div class="val">${dbSavedJobs.length}</div></div>
      <div class="info-item"><div class="lbl">Alumni</div><div class="val">${alumni.length}</div></div>
    </div>
    <h3><i class="fas fa-briefcase"></i> Job Openings</h3>
  `;
  if(!jobs.length){ html += emptyState('No jobs posted yet', 'fa-briefcase'); }
  else {
    html += jobs.map(j => {
      const applied = dbJobApplications.some(a => a.jobId === j.id);
      const saved = dbSavedJobs.some(s => s.jobId === j.id);
      return `
        <div class="job-card">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap">
            <div>
              <h4>${esc(j.title||'—')}</h4>
              <div class="co">${esc(j.company||'')}</div>
            </div>
            ${j.type ? `<span class="badge blue">${esc(j.type)}</span>` : ''}
          </div>
          <div class="job-meta">
            ${j.location ? `<span><i class="fas fa-map-marker-alt"></i> ${esc(j.location)}</span>` : ''}
          </div>
          ${j.description ? `<div class="job-desc">${esc(j.description)}</div>` : ''}
          <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
            <button class="btn-sm ${applied?'ghost':'primary'}" ${applied?'disabled':''} onclick="applyJob('${j.id}')">
              <i class="fas fa-paper-plane"></i> ${applied?'Applied':'Apply'}
            </button>
            <button class="btn-sm ghost" onclick="toggleSaveJob('${j.id}', ${saved})">
              <i class="fa${saved?'s':'r'} fa-heart"></i> ${saved?'Saved':'Save'}
            </button>
          </div>
        </div>
      `;
    }).join('');
  }

  html += `<h3><i class="fas fa-users"></i> Alumni Network</h3>`;
  if(!alumni.length){ html += emptyState('No alumni listed', 'fa-users'); }
  else {
    html += `<div class="alumni-grid">
      ${alumni.map(a => `
        <div class="alumni-card">
          <div class="av">${esc(getInitials(a.name))}</div>
          <div class="nm">${esc(a.name||'—')}</div>
          <div class="dt">${esc(a.program||'')} ${a.graduation?'· '+esc(a.graduation):''}</div>
          <div class="cmp">${esc(a.company||'')} ${a.position?'· '+esc(a.position):''}</div>
        </div>
      `).join('')}
    </div>`;
  }
  $('#careersContent').innerHTML = html;
}
window.applyJob = async function(jobId){
  const j = dbJobs.find(x => x.id === jobId);
  if(!j) return;
  try{
    await db.ref(`${ROOT}/jobApplications/${currentUser.uid}/${jobId}`).set({
      jobId, jobTitle: j.title, company: j.company,
      appliedAt: Date.now(), status: 'pending'
    });
    toast('Application submitted!', 'ok');
    renderCareers();
  }catch(e){ toast('Failed to apply: '+e.message, 'err'); }
};
window.toggleSaveJob = async function(jobId, currentlySaved){
  try{
    const ref = db.ref(`${ROOT}/savedJobs/${currentUser.uid}/${jobId}`);
    if(currentlySaved) await ref.remove();
    else await ref.set({ jobId, savedAt: Date.now() });
    toast(currentlySaved ? 'Job unsaved':'Job saved', 'ok');
    renderCareers();
  }catch(e){ toast('Failed: '+e.message, 'err'); }
};

    a.href = canvas.toDataURL('image/png');
    a.click();
    toast('ID downloaded','ok');
  }catch(e){ toast('Failed: '+e.message, 'err'); }
}
function openShareModal(){
  $('#shareModal').classList.add('open');
  const qr = $('#shareQrcode'); qr.innerHTML = '';
  try{
    new QRCode(qr, { text: `${appData.fullName} · ${appData.studentNumber}`, width:180, height:180, colorDark:'#1e40af', colorLight:'#ffffff' });
  }catch(e){}
}
function shareApp(){
  const url = window.location.origin + window.location.pathname;
  if(navigator.share) navigator.share({ title:'NORTEC Portal', text:'Join NORTEC', url }).catch(()=>{});
  else navigator.clipboard.writeText(url).then(()=>toast('Link copied','ok'));
}

   ═══════════════════════════════════════════════════════════════ */
function renderPlanner(){
  const events = dbPlannerEvents;
  const days = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const times = ['08:00','10:00','12:00','14:00','16:00','18:00'];
  let grid = '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">';
  days.forEach(d => { grid += `<div style="background:var(--blue-light);padding:8px;text-align:center;font-weight:700;font-size:12px;color:var(--blue-dark);border-radius:6px">${d}</div>`; });
  times.forEach(t => {
    days.forEach(d => {
      const evs = events.filter(e => e.day === d && e.time === t);
      grid += `<div style="background:#fff;border:1px solid var(--border-color);border-radius:6px;padding:6px;min-height:56px;font-size:10px">
        <div style="font-weight:700;color:var(--text-muted);font-size:9px">${t}</div>
        ${evs.map(e => `<div style="background:var(--blue-light);border-radius:4px;padding:2px 6px;margin-top:2px;font-size:9px;color:var(--blue-dark);font-weight:600">${esc(e.title)}</div>`).join('')}
      </div>`;
    });
  });
  grid += '</div>';

  $('#plannerContent').innerHTML = `
    <h3><i class="fas fa-calendar-plus"></i> Study Planner</h3>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
      <select id="plDay" style="flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--border-color);font-family:inherit">
        ${days.map(d => `<option>${d}</option>`).join('')}
      </select>
      <input id="plTime" placeholder="14:00" style="width:90px;padding:10px;border-radius:10px;border:1.5px solid var(--border-color);font-family:inherit" />
      <input id="plTitle" placeholder="Event" style="flex:2;min-width:140px;padding:10px;border-radius:10px;border:1.5px solid var(--border-color);font-family:inherit" />
      <button class="btn-sm primary" id="plAdd"><i class="fas fa-plus"></i> Add</button>
    </div>
    ${grid}
  `;
  $('#plAdd')?.addEventListener('click', async () => {
    const day = $('#plDay').value, time = $('#plTime').value.trim(), title = $('#plTitle').value.trim();
    if(!time || !title){ toast('Fill in time and title','err'); return; }
    try{
      await db.ref(`${ROOT}/planner/${currentUser.uid}`).push({ day, time, title, createdAt: Date.now() });
      toast('Event added','ok');
    }catch(e){ toast('Failed: '+e.message,'err'); }

/* ═══════════════════════════════════════════════════════════════

   ═══════════════════════════════════════════════════════════════ */
function bindRealtime(){
  const uid = currentUser.uid;

  // User profile
  db.ref(`${ROOT}/users/${uid}`).on('value', s => { userData = s.val() || {}; });

  // Application
  db.ref(`${ROOT}/applications/${uid}`).on('value', s => {
    appData = { uid, ...(s.val() || {}) };
    if((appData.status || '').toLowerCase() !== 'approved'){
      toast('Your account is no longer approved. Redirecting…','err');
      setTimeout(() => window.location.replace('index.html'), 1200);
      return;
    }
    // Refresh header + home
    const name = appData.fullName || userData.fullName || 'Student';
    $('#headerName').innerHTML = `${esc(getFirstName(name))} <span class="accent">Dashboard</span>`;
    if($('#homePage').classList.contains('active-page')) renderHome();
  });

  // Courses + subfolders + videos + docs
  db.ref(`${ROOT}/courses`).on('value', s => { allCourses = toArray(s.val()); if($('#coursesPage').classList.contains('active-page')) renderCourses(); if($('#homePage').classList.contains('active-page')) renderHome(); });
  db.ref(`${ROOT}/subfolders`).on('value', s => { allSubfolders = toArray(s.val()); });
  db.ref(`${ROOT}/videos`).on('value', s => { allVideos = toArray(s.val()); });
  db.ref(`${ROOT}/docs`).on('value', s => { allDocs = toArray(s.val()); });

  // Approved courses/subfolders
  db.ref(`${ROOT}/approvedPurchases/${uid}`).on('value', s => {
    approvedCourses.clear(); approvedCoursesData = {};
    approvedSubfolders.clear(); approvedSubfoldersData = {};
    const data = s.val() || {};
    Object.keys(data).forEach(id => {
      const d = data[id];
      const itemType = d.itemType || 'course';
      const rec = { expiresAt: d.expiresAt||null, durationType: d.durationType||'lifetime', durationValue: d.durationValue||0, amount: d.amount||0, title: d.itemTitle||'', itemType };
      if(itemType === 'subfolder'){ approvedSubfolders.add(id); approvedSubfoldersData[id] = rec; }
      else { approvedCourses.add(id); approvedCoursesData[id] = rec; }
    });
  });

  // Pending purchases
  db.ref(`${ROOT}/pendingPurchases/${uid}`).on('value', s => {
    const data = s.val() || {};
    pendingPurchases = {}; pendingSubfolders = {}; allUserTransactions = [];
    Object.entries(data).forEach(([txId, tx]) => {
      allUserTransactions.push({ id:txId, ...tx, source:'pending' });
      if(tx.status === 'pending'){
        if(tx.itemType === 'subfolder') pendingSubfolders[tx.itemId] = { amount:tx.amount, txId };
        else if(!tx.itemType || tx.itemType === 'course') pendingPurchases[tx.itemId] = { amount:tx.amount, txId };
      }
    });
    if($('#financePage').classList.contains('active-page')) renderFinance();
  });

  // Registers
  db.ref(`${ROOT}/registers`).on('value', s => {
    allRegisters = toArray(s.val());
    userRegisterIds.clear();
    allRegisters.forEach(r => { if(r.members && r.members.includes(uid)) userRegisterIds.add(r.id); });
  });

  // Assessments
  db.ref(`${ROOT}/assessments`).on('value', s => { allAssessments = toArray(s.val()); if($('#assignmentsPage').classList.contains('active-page')) renderAssignments(); });
  db.ref(`${ROOT}/assessmentResponses`).on('value', s => { allAssessmentResponses = toArray(s.val()); });

  // Notices
  db.ref(`${ROOT}/notices`).on('value', s => {
    dbNotices = toArray(s.val()).sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
    if($('#noticesPage').classList.contains('active-page')) renderNotices();
    if($('#homePage').classList.contains('active-page')) renderHome();
  });

  // Complaints
  db.ref(`${ROOT}/complaints/${uid}`).on('value', s => {
    dbComplaints = toArray(s.val());
    if($('#complaintsPage').classList.contains('active-page')) renderComplaints();
  });

  // Accommodation
  db.ref(`${ROOT}/accommodations/${uid}`).on('value', s => {
    dbAccommodation = s.val() || {};
    if($('#accommodationPage').classList.contains('active-page')) renderAccommodation();
  });

  // Appeal
  db.ref(`${ROOT}/appeals/${uid}`).on('value', s => {
    dbAppeal = s.val() || {};
    if($('#appealPage').classList.contains('active-page')) renderAppeal();
  });

  // Diploma
  db.ref(`${ROOT}/diplomas/${uid}`).on('value', s => {
    dbDiploma = s.val() || {};
    if($('#diplomaPage').classList.contains('active-page')) renderDiploma();
  });

  // SUP
  db.ref(`${ROOT}/sup/${uid}`).on('value', s => {
    dbSup = s.val() || {};
    if($('#supPage').classList.contains('active-page')) renderSup();
  });

  // TEVETA
  db.ref(`${ROOT}/teveta/${uid}`).on('value', s => {
    dbTeveta = s.val() || {};
    if($('#tevetaPage').classList.contains('active-page')) renderTeveta();
  });

  // Timetable
  db.ref(`${ROOT}/timetables/${uid}`).on('value', s => {
    dbTimetable = toArray(s.val());
    if($('#timetablePage').classList.contains('active-page')) renderTimetable();
  });

  // Attendance
  db.ref(`${ROOT}/attendance/${uid}`).on('value', s => {
    dbAttendance = toArray(s.val());
    if($('#attendancePage').classList.contains('active-page')) renderAttendance();
    if($('#homePage').classList.contains('active-page')) renderHome();
  });

  // Exams
  db.ref(`${ROOT}/exams/${uid}`).on('value', s => {
    dbExams = toArray(s.val());
    if($('#examsPage').classList.contains('active-page')) renderExams();
  });

  // Clearance
  db.ref(`${ROOT}/clearance/${uid}`).on('value', s => {
    dbClearance = toArray(s.val());
    if($('#clearancePage').classList.contains('active-page')) renderClearance();
    if($('#homePage').classList.contains('active-page')) renderHome();
  });

  // Finance
  db.ref(`${ROOT}/finance/${uid}`).on('value', s => {
    dbFinanceTransactions = toArray(s.val());
    if($('#financePage').classList.contains('active-page')) renderFinance();
    if($('#homePage').classList.contains('active-page')) renderHome();
  });

  // Library
  db.ref(`${ROOT}/library/books`).on('value', s => {
    dbLibraryBooks = toArray(s.val());
    if($('#libraryPage').classList.contains('active-page')) renderLibrary();
    if($('#homePage').classList.contains('active-page')) renderHome();
  });
  db.ref(`${ROOT}/library/borrowed/${uid}`).on('value', s => {
    dbBorrowedBooks = toArray(s.val());
    if($('#libraryPage').classList.contains('active-page')) renderLibrary();
  });

  // Careers
  db.ref(`${ROOT}/jobs`).on('value', s => {
    dbJobs = toArray(s.val());
    if($('#careersPage').classList.contains('active-page')) renderCareers();
  });
  db.ref(`${ROOT}/savedJobs/${uid}`).on('value', s => { dbSavedJobs = toArray(s.val()); });
  db.ref(`${ROOT}/jobApplications/${uid}`).on('value', s => { dbJobApplications = toArray(s.val()); });

  // Alumni
  db.ref(`${ROOT}/alumni`).on('value', s => {
    dbAlumni = toArray(s.val());
    if($('#alumniPage').classList.contains('active-page')) renderAlumni();
    if($('#careersPage').classList.contains('active-page')) renderCareers();
  });
  db.ref(`${ROOT}/mentorApplications/${uid}`).on('value', s => { dbMentorApplications = toArray(s.val()); });

  // Planner
  db.ref(`${ROOT}/planner/${uid}`).on('value', s => {
    dbPlannerEvents = toArray(s.val());
    if($('#plannerPage').classList.contains('active-page')) renderPlanner();
  });

  // User settings
  db.ref(`${ROOT}/userSettings/${uid}`).on('value', s => {
    dbUserSettings = s.val() || {};
  });

  // Notifications (per-user)
  db.ref(`${ROOT}/userNotifications/${uid}`).on('value', s => {
    const data = s.val() || {};
    notifications = Object.entries(data).map(([id, n]) => ({ id, ...n }));
    notifications.sort((a,b) => (b.timestamp||0) - (a.timestamp||0));
    renderNotifDropdown();
  });

  // In-app broadcast notices (global for students)
  db.ref(`${ROOT}/inAppNotifications`).on('value', s => { dbLiveNotifs = s.val() || {}; });

  // Promos
  db.ref(`${ROOT}/promos`).on('value', s => { dbPromos = toArray(s.val()); });

  // Live classes
  db.ref(`${ROOT}/liveClasses`).on('value', s => {
    const data = s.val() || {};
    let found = null;
    for(const [id, cls] of Object.entries(data)){
      if(cls.status === 'active' || cls.status === 'ongoing'){
        const reg = allRegisters.find(r => r.id === cls.registerId);
        if(reg && reg.members && reg.members.includes(uid)){ found = { id, ...cls }; break; }
      }
    }
    liveClassData = found;
    liveClassId = found?.id || null;
    if(liveClassData) toast('📡 Live class is ongoing','info');
  });
}

/* ═══════════════════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════════════════ */
function bindEvents(){
  $('#menuBtn').addEventListener('click', openSidebar);
  $('#sidebarClose').addEventListener('click', closeSidebar);
  $('#sidebarOverlay').addEventListener('click', closeSidebar);
  $$('.sidebar .nav-item').forEach(btn => {
    btn.addEventListener('click', function(){
      const page = this.dataset.page;
      if(page){ closeSidebar(); showPage(page); }
    });
  });
  $$('.bn-item').forEach(btn => btn.addEventListener('click', function(){ showPage(this.dataset.nav); }));

  $('#notifBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    $('#notifDrop').classList.toggle('open');
    setTimeout(markAllNotifsRead, 400);
  });
  document.addEventListener('click', (e) => {
    if(!$('#notifDrop').contains(e.target) && !$('#notifBtn').contains(e.target)){
      $('#notifDrop').classList.remove('open');
    }
  });
  $('#clearNotifs').addEventListener('click', markAllNotifsRead);

  $('#shareClose').addEventListener('click', () => $('#shareModal').classList.remove('open'));
  $('#shareModal').addEventListener('click', e => { if(e.target === $('#shareModal')) e.target.classList.remove('open'); });
  $('#shareDownloadBtn').addEventListener('click', () => { downloadIdCard(); $('#shareModal').classList.remove('open'); });

  $('#logoutBtn').addEventListener('click', async () => {
    if(!confirm('Log out of your account?')) return;
    try{ await auth.signOut(); }catch(e){}
    window.location.replace('index.html');
  });

  document.addEventListener('keydown', e => {
    if(e.key === 'Escape'){
      if($('#sidebar').classList.contains('open')) closeSidebar();
      $('#notifDrop').classList.remove('open');
      $('#shareModal').classList.remove('open');
    }
  });
}

async function init(user){
  currentUser = user;
  try{
    const snap = await db.ref(`${ROOT}/applications/${user.uid}`).get();
    if(!snap.exists()){
      toast('No application record. Redirecting…','err');
      setTimeout(() => window.location.replace('index.html'), 1200);
      return;
    }
    appData = { uid: user.uid, ...snap.val() };
    if((appData.status || '').toLowerCase() !== 'approved'){
      toast('Your application is not approved yet.','err');
      setTimeout(() => window.location.replace('index.html'), 1200);
      return;
    }

    // Show dashboard
    $('#appLoader').classList.add('hidden');
    $('#appRoot').style.display = 'flex';
    bindEvents();
    bindRealtime();
    renderHome();
    renderNotifDropdown();
    showPage('home');
  }catch(e){
    console.error(e);
    toast('Failed to load: ' + e.message,'err');
    setTimeout(() => window.location.replace('index.html'), 1500);
  }
}

auth.onAuthStateChanged(user => {
  if(!user){ window.location.replace('index.html'); return; }
  init(user);
});
</script>
